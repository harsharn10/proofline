# Render Blueprint for the Proofline site (same pattern as DeathbyTax).
# Connect in the Render dashboard: New + → Blueprint → select harsharn10/proofline → Apply.
services:
  - type: web
    name: proofline
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run score && cd site && npm ci --include=dev && npm run build:render
    startCommand: node site/.output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
