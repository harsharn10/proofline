    summary: A Uniswap v4 hook that recaptures cross-pool arbitrage and pays it to swappers and LPs. On Robinhood Chain the correction settles in the same swap; realised profit is split among the swapper, LPs, a referral and the WTH treasury. Users swap as usual; projects attach the hook at v4 pool creation. The hook is 0xc52f…54c0 and the WTH token is 0xb8Fa…fF79, created by whatthehook.eth.
