    summary: In-kind index baskets of Robinhood Stock Tokens. A user deposits listed Stock Tokens or chain-native tokens, or pays USDG or ETH through VimenZap4, and receives one ERC-20 share; redeem burns the share and returns the same units. Frozen baskets lock the recipe at deploy; agentic baskets let an agent rebalance inside contract ceilings. First-party frozen guardian is Safe 0xc7aBc67fBB12B69240A4C213c39547C8a345Ec02.
