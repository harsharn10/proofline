  prior:
    summary: "A liquidity manager: users deposit a token or LP into a stake or a shaped Uniswap position and collect a share of that pool's swap fees in ETH. Open or join a pool on deltaliquidity.app, claim streamed fees after a 1% protocol cut, and withdraw with no lockup. @deltaliquidity runs the app. DELTA is a Pons v1 launch token, not the vault."
    tldr: "A liquidity manager: users deposit a token or LP into a stake or a shaped Uniswap position and collect a share of that pool's swap fees in ETH."
    why_people_care:
      - "Delta is a live LP manager on chain 4663: it sits next to Uniswap v3 and v4 books and takes a 1% cut of claimed swap fees rather than minting rewards. [claim S10]"
      - The DELTA/WETH Uniswap v3 book was about $1.16M of liquidity with about $4.34M of 24h volume at fetch, matching the GeckoTerminal trending DELTA/WETH print this window. [claim S17 S18]
      - That book is the token pair, not DefiLlama's $13,804 protocol-custodied TVL. [claim S19]
    risks:
      - Site TVL (~$1.44M) and Llama TVL (~$13.8k) are different custody slices. Using the token pair or the site header as "protocol TVL" overstates what the contracts hold. [claim S9 S19]
      - Vault and ladder owner() values are EOAs with no timelock in the path that was opened. [verified S21] [claim S10]
      - A second Robinhood token also named Delta / DELTA (0xfA1A…bD5) exists. Pairing that ticker with this product mixes two contracts. [verified S29]
