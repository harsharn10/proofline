  new:
    summary: "A liquidity manager: users deposit a token or LP into a stake or a shaped Uniswap position and collect a share of that pool's swap fees in ETH. Open or join a pool on deltaliquidity.app, claim streamed fees after a protocol cut, and withdraw with no lockup. @deltaliquidity runs the app. DELTA is a Pons v1 launch token, not the vault."
    tldr: LP manager on 4663. Docs list ladder v8 and a 7.5% claim fee; deployed fee controls and the app's active manager remain unconfirmed.
    why_people_care:
      - "Thesis: docs describe shaped Uniswap liquidity positions and a share of pool fees. [claim S39]"
      - "Traction: DELTA/WETH v3 still prints seven-figure 24h volume. [claim S42]"
      - "Catalyst: docs list ladder v8 above v3; which manager the app uses remains unconfirmed. [claim S39]"
    risks:
      - VaultFactory and ladder v8 return different owner addresses. [verified S44 S50]
      - FAQ says the owner cannot raise fees or move staked positions; deployed limits are unconfirmed. [claim S39]
      - Llama TVL, DELTA pool liquidity and the project's TVL claim are different measures, not interchangeable totals. [inference S40 S42 S54]
