    summary: Hookr composes Uniswap v4 hooks on Robinhood Chain. A user stacks up to five on-swap rules, publishes the hook for royalties, and opens a new token pool with those rules fixed at creation. Instant launches open at a platform-wide 2.5 ETH FDV; auctions use Uniswap CCA. $HOOKR trades in a hookless v4 pool. The deployer EOA is labelled nodar.eth.
