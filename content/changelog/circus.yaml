  prior:
    summary: Circus is a Robinhood Chain token launchpad at circus.trade. Classic Curve launches a fixed-supply token onto an ETH bonding curve and graduates into a locked Uniswap pool. A second Fair Open lane is described as a Doppler locked Uniswap v4 pool with no bonding phase. The handle linked from the site footer is @circus_trade.
    tldr: Circus is a Robinhood Chain token launchpad at circus.trade.
    why_people_care:
      - Emerson's 30-day labeled set still has a Circus row (597 tokens, one factory) while most DEX volume sits on other pads. [claim S13 S14]
      - OKX reconstructs about $46.2M lifetime DEX volume on the circus.trade label, with a large RWA share on few traded tokens. [claim S13 S14]
      - The pad is not a census row. [claim S13 S14]
    risks:
      - The live factory is an upgradeable ERC1967 proxy. owner() is one externally owned account with no code and no pending owner. [verified S8 S9] [claim S2 S12]
      - JS names a timelock, but getMinDelay() reverted and the proxy owner is still that EOA. [verified S8 S9] [claim S2 S12]
      - Home copy and how-it-works disagree on Uniswap v3 versus v4 at graduation. [verified S8 S9] [claim S2 S12]
