  new:
    summary: Circus is a Robinhood Chain token launchpad at circus.trade. Classic Curve launches a fixed-supply token onto an ETH bonding curve and graduates into a locked Uniswap pool. A second Fair Open lane is described as a Doppler locked Uniswap v4 pool with no bonding phase. The handle linked from the site is @circus_trade.
    tldr: ETH bonding-curve pad on 4663. Official copy disagrees on v3 vs v4 graduation; implementation source was not read this pass.
    why_people_care:
      - "Thesis: a public ETH curve plus a claimed locked IPO is the product, not a private raise. [claim S2]"
      - "Traction: homepage printed 48 graduated tokens and $1.22M raised on curves. [claim S19]"
      - "Catalyst: homepage says v3 graduation; docs say v4. The routing conflict remains unresolved. [disputed S19 S2]"
    risks:
      - Proxy owner() returns an address with no code, not the labeled timelock address. [verified S21 S24 S25]
      - Homepage and docs disagree on Uniswap v3 vs v4 graduation. [disputed S19 S2]
      - No audit artifact was located despite "audited factory" copy. [unknown]
