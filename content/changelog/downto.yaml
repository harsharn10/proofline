  new:
    summary: "Down to Finance is a permissionless DETF (Decentralized ETF) on Robinhood Chain: a creator deploys one token as a claim on a basket of vault shares and Uniswap v4 pools; the first bond turns that DETF on, then holders mint, hold, or burn. The fee-accruing $DTF token at 0xeE5576Fa1Bcaa380e591D01245f406f3f384eb01 is a verified Pons v2 launch token. App explore lists no live DETF this pass; Protocol DETF staking is unconfigured."
