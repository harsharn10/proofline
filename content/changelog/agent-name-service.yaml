  new:
    tldr: .agent names resolve on 4663 to an agent key and wallet. Three of four registry contracts share one EOA owner; resolver owner() reverts.
    why_people_care:
      - "Thesis: Robinhood Chain agent software can look up a stable handle instead of a hex string. [claim S28]"
      - "Traction: DexScreener shows a thin $ANS/ETH Uniswap v4 book, not registry fee revenue. [claim S32]"
      - "Catalyst: docs describe governance-configurable fees but do not name a fee recipient. [claim S29]"
    risks:
      - Three registry contracts return the same owner address; that address has no code. [verified S33 S34 S36 S41]
      - No audit report was located. [unknown]
      - Registration ETH and any $ANS buyback sink are not printed on docs. [claim S29]
