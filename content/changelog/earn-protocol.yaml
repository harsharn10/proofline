  severity: Review
  title: Token owner is the shared Airlock launch contract
  detail: A 2026-09-02 chain read found owner() on the EARN token returns 0xeb7c…0862, the verified Airlock contract, which also owns the EARN, Statics and Artificial Inu tokens. Control of the token's owner-only functions sits with shared launch infrastructure rather than a project-held key. Recorded as a verified risk finding with the RPC read as the source.
