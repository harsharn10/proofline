    headline: Pons enters Proofline coverage with Elevated risk
    summary: Proofline completed its first full review of Pons. The product is live and its owner is an identifiable 2-of-3 Safe, but the deployed system has no timelock and no closed audit matched to the deployed code.
    why_it_matters:
      - Owner actions can take effect without a documented delay.
      - The project's own documentation describes the system as unaudited.
    watch_next: A deployed-code audit, timelock, clearer signer policy, or a source-level bound on owner setters would materially improve the assessment.
