  detail: "Research intake of the 2026-08-31 research pass plus the v2 docs page read during intake: Pons v1 (fixed-supply token straight into a locked Uniswap V3 WETH pool) and v2 (bonding curve graduating into a permanently locked Uniswap v4 pool, pairable against approved assets, three audits in progress and none closed) both operate. All fourteen documented addresses are contracts on chain 4663, twelve with verified source and no proxy; owner() on the factories, lockers, hook and buyback vault is a 2-of-3 Safe with no timelock. The seed summary described v2 only; the summary now names both generations."
