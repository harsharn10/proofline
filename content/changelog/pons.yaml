  title: First evidence score — 41 provisional, 64% confidence, Elevated risk
  detail: "Security 8/35 (deployment verifiability partial; authorization topology partial — 2-of-3 Safe; incident handling full; privileged power, timelock, audit match and safeguards zero — no timelock, no closed audit, owner setters not yet bounded by a source read). Engineering, transparency, maturity and economic each mixed (50). Confidence 64 (primary sources 70, onchain 60, corroboration 45, freshness 95, review completeness 50); single researcher, approver pending. Risk Elevated per PRD §6.4 (new production system its docs call unaudited, undelayed owner powers); no numeric override. What raises it: a source read bounding the owner setters, a published audit matching the deployed commit, a timelock or documented signer policy, a bounty or incident process."
