summary: A one-billion-supply ERC-20 launched on Pons v2 against MSFT. PonsV2LaunchFactory deploys Verity (VERITY), mints the supply to a bonding curve, then createGraduatedPool seeds the VERITY/MSFT Uniswap v4 book. Traders buy and sell VERITY on that book. MSFT is the pair rail, not the subject. No official site was located this pass; constructor twitter https://x.com/VerityonRH is unconfirmed-official.
