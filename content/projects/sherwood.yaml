    - text: "The two intakes describe different products under the Sherwood name: the workbook an AI-agent capital layer with a $WOOD token, Proofline's chain map a private-transfer tool with a DefiLlama TVL row."
      class: claim
      sources:
        - S4
        - S3
    - text: "Receipts: sherwood.cash and /docs, github.com/sherwood-cash/contracts README and deployRobinhood.js, x.com/sherw00d_cash and named status URLs, t.me/sherwood_cash, Blockscout address/token/tx APIs, DexScreener latest/dex/tokens, DefiLlama protocol/fees/adapter, docs.sherwood.sh (other product), and RPC eth_getCode/eth_call were opened on 2026-09-03; excerpts are copied from those responses. [verified R-1 R-5 R-6 R-10] - Numbers: 72357.59239 USD is Llama `currentChainTvls['Robinhood Chain']`, not an all-chains total; 25.87 USD is the 2026-09-02 dailyFees/revenue bar, not the pulled-file 17.27 from 2026-09-02T21:05; 60337.16 USD is DexScreener Uniswap v4 SHERWOOD/ETH volume.h24, not all SHERWOOD pairs; 658 is Blockscout holders_count. [claim R-3 R-8 R-10 R-20] - Adversarial: the strongest contrary reading is that census Sherwood is the sherwood.sh `$WOOD` agent layer, or a same-ticker meme. Distinct handle, domain, vault address, Llama twitter `sherw00d_cash`, and Pons launch params listing `@sherw00d_cash` argue against a merge."
      class: inference
      sources:
        - S9
        - S15
        - S32
    - text: SwapLogic is a UUPS proxy with an unverified implementation; `CONFIG_TIMELOCK` is 0. [verified R-6 R-19] - Vault admin and fee recipient are EOAs with no on-chain timelock. [verified R-6] - Deposit and withdrawal amounts are public; size/timing matching is a documented usage issue. [claim R-17] - No SherwoodVault audit report was located; Llama `audits` is 0. [unknown] - `$SHERWOOD` launch from `0x2c61c825…` is a different EOA than the vault admin. [verified R-9] - Other "Sherwood" / `$WOOD` / `SWOOD` tickers exist on the chain; this slug is vault `0xf540…0736` and token `0xD4DC…92c1`.
      class: claim
      sources:
        - S16
        - S32
