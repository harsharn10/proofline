    - text: "Receipts: pair.fund and /docs, @pairdotfund profile and six posts, Blockscout API v2 plus RPC for the token, proxy, implementation and owner, the launchTokenMulti transaction, DexScreener token API, GitHub user API, GlobeNewswire reprint, @paird0tfund and @pairecosystem were opened on 2026-09-03; excerpts are copied from those pages. [verified R-1 R-3 R-9 R-11 R-13 R-14] - Numbers: DexScreener figures are the named PAIR/SPY Uniswap v4 pair on chain robinhood, not an all-chains total. Holders is Blockscout holders_count. The $40M and $26M figures are project posts. [verified R-10 R-14] [claim R-7 R-15] - Adversarial: the strongest contrary reading is that PAIR is LONG, Pons, or an unverified copy at @paird0tfund. Handles, domains and the launchTokenMulti creator on 0x8660…Ae62 argue against LONG and Pons; the site JS links only @pairdotfund. [verified R-1 R-13]"
