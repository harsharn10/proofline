summary: A multipool stock-paired launchpad on Robinhood Chain. A creator deploys a fixed-supply ERC-20 through PairLaunchpadV5 in one transaction; the factory seeds permanently locked Uniswap v4 pools against one to five Robinhood stock tokens. The protocol token PAIR trades versus SPY. PAIR Labs runs it at pair.fund / @pairdotfund.
