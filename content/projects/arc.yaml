summary: Arc is a liquidity-margin layer on Robinhood Chain. Official docs say a CL position can stay in range while valued as USDG collateral. The homepage publishes token `0xce84…` as ARC LIQUIDITY / ARC. An app-bundled Railway API lists six stock/USDG markets and an ArcLendingPool. RPC and Blockscout reproduced the token and six Arc-named core contracts on chain 4663. Distinct from Arrow Finance CDP. Lending balances were not independently read on DefiLlama.
tldr: "Arc on chain 4663: LP-as-collateral USDG credit; ARC token and ArcLendingPool exist; six stock/USDG markets claimed. [CLM-1 CLM-3]"
why_people_care:
  - "Thesis: a native isolated money market that values CL positions as USDG collateral is a different machine from Arrow Finance CDP. [claim S1] [verified S8]"
  - "Traction: ARC token, ArcLendingPool, and five sibling Arc contracts have verified source and bytecode on 4663; DexScreener 24h volume about $2.9k. [verified S8 S9] [claim S11]"
  - "Catalyst: still off census after the 2026-08-31 candidate; this packet is the seed for slug arc. [claim S1] [verified S8]"
risks:
  - Docs state v1 has not been audited; testing is not an audit. [claim S2]
  - ArcRegistry, ArcOracle, ArcPositionManager, ArcLendingPool, and ArcCore owner() is one EOA. [verified S9]
  - USDG pool totals in this round came from a Railway API, not an explorer or DefiLlama protocol row. [claim S6] [verified S12]
