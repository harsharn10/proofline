summary: Vynex turns a Robinhood Chain deposit into a transferable ERC-20 YieldShare that redeems the underlying at any block. A user deposits a stock token or USDG and can sell, transfer, or burn the share. Factory vaults harvest pool fees into the share price; a routed USDG vault forwards deposits into steakUSDG on Morpho Blue. One EOA owns the factory. $VYNEX launched through Pons v2.
