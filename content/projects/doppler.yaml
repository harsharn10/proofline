summary: Doppler is an onchain token-launch protocol. Teams pass launch parameters into an Airlock contract, which wires a token factory, hook initializer, governance, and migrator. Price discovery is a static, multicurve, or dynamic auction; liquidity can migrate after the auction. Custom hooks can run when the market opens, on each swap, or at graduation. On Robinhood Chain the live Airlock is `0xeb7C034704eF8Dcd2D32324c1545f62fB4aD0862` and the token factory is DopplerERC20V1Factory `0x1B37D3a72082029c44B35B604Ea473617580b69a`. The handle is @dopplerprotocol; the site is doppler.lol. This slug is the protocol, not a LONG clone token.
