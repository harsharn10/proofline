    - text: "Receipts: meshgateway.co, /mesh, /earn, /status, whitepaper, @MeshGateway profile and posts, GitHub user, Blockscout token/curve/splitter/proxy/create/settle txs, RPC, DexScreener, and CoinGecko were opened on 2026-09-03 and excerpts copied from the responses. [verified R-1 R-6 R-8 R-12] - Numbers: 162179.74 is the MESH/ETH Uniswap v4 24h volume, not a sum of the USDG pairs and not CoinGecko total_volume. Holders 1063 is Blockscout `holders_count`. 480.66 USDG is the site all-time settlement figure, not TVL. [claim R-6 R-9 R-14] - Adversarial: the strongest contrary reading is that Mesh is only a Pons-launched memecoin wrapping a public x402 proxy, with settlement counts from few wallets. Token socials, site CA, GitHub CA, and a pons-labelled USDG settle tx still leave the gateway as a Robinhood-native rail; unique-payer concentration and missing epoch contracts stay open."
      class: inference
      sources:
        - S12
        - S16
        - S18
    - text: Epoch fee pool and stock-swap path were not reproduced on a Mesh contract this pass. [unknown] - Relayer and splitter treasury are externally owned accounts. [verified R-8] - /status unique payers 18 versus 11,323 settlements. [claim R-14] - DexScreener and CoinGecko market-cap figures disagree. [claim R-9 R-21] - Permit2 proxy is shared x402 bytecode from 11 Aug, not shown as a Mesh deploy.
