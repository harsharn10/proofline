summary: An HTTP 402 machine-payments gateway on Robinhood Chain. An agent pays USDG per API call through a Permit2 witness transfer; Mesh's relayer broadcasts it and the stablecoin lands in the merchant wallet. Holders of MESH above 500,000 receive the day's protocol-fee pool as a tokenized stock. @MeshGateway runs meshgateway.co.
