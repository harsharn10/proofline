findings:
  positive:
    - text: The official account posted on 2026-07-15 that launches go to Uniswap V3 from block one with no bonding curve, are free apart from gas, and carry a 2% per-transaction and per-wallet cap until a $40k market cap that then clears itself on chain.
      class: claim
      sources:
        - S5
  risk:
    - text: The official account posted the same day that the first factory had bugs and had been replaced by a new, ownerless-at-launch factory, with the fee split moving from 100% creator to 80% creator / 20% platform.
      class: claim
      sources:
        - S5
    - text: A token with the SAFEHOOD ticker at a different address (0x663492eab45ed21d6bdd7836efdc1a9cd51ae199, @safehoodonrh) is a Pons graduation using Sinjoh's fee router and is not this protocol.
      class: claim
      sources:
        - S6
        - S4
    - text: "Receipts: GitHub README and ProtocolConfig, @_safehood profile and posts, Blockscout API v2 for Launchpad/TokenFactory/FeeDistributor/Treasury/MRD1/0x262b60/Pons token plus create and grantRole txs, RPC views, Vercel 404, Bitquery hood.fun, Uniswap pools.trade blog were opened on 2026-09-03; excerpts are copied from those responses. [verified R-1 R-3 R-9 R-11] - Numbers: 0.018 ETH is `totalTradeVolumeWei` on 0xe893, not a USD volume and not an all-chains figure. FEE_TIER 10000 is 1%, not the README 0.3% how-a-launch-works line. tokenCount 5 is the factory array, not DexScreener pairs. [verified R-11] - Adversarial: the strongest contrary reading is that this slug is hood.fun, pools.trade, census Meridian, or the Pons $SAFEHOOD token. Different factories, handles and mechanism (curve vs Uniswap v3 vs Uniswap v4 vs Pons) argue they stay separate. A second contrary reading is that 0xe893 is abandoned and the live pad is 0x475c/0xeADD; both were created by 0x7817…a846."
      class: inference
      sources:
        - S15
        - S24
        - S26
        - S29
        - S30
    - text: One EOA holds DEFAULT_ADMIN, LIQUIDITY_MANAGER and OPERATOR with no code and no timelock observed. [verified R-11 R-16] - `collectFees` can remove protocol-held Uniswap v3 principal to Treasury; MRD1 liquidity views returned 0. [verified R-10 R-11] - Trade-fee split disagrees across verified 0xe893 source (100% creator) and later GitHub/X copy (80/20). [disputed R-2 R-5 R-10] - safehood.fun is 404; last @_safehood post is 2026-07-16. [claim R-3 R-22] - Pad-branded SAFEHOOD 0x262b60… is not from the GitHub-claimed factory; a Pons token uses the same ticker.
      class: verified
      sources:
        - S24
        - S26
