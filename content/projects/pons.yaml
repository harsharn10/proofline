      - S3
review:
  researcher: harsharn10
  approver: pending
  methodology_version: proofline-v1.0
  reviewed_at: 2026-08-31
  published_at: null
findings:
  positive:
    - text: Pons publishes an official site at https://ponsfamily.com.
      class: claim
      sources:
        - S1
    - text: The current Pons factory creates fixed-supply tokens and locked Uniswap V3 WETH pools in one transaction, without a bonding curve or later migration.
      class: claim
      sources:
        - S2
    - text: Pons publishes the active factory and locker addresses plus event signatures and read examples for independent indexers.
      class: claim
      sources:
        - S2
    - text: DefiLlama reported approximately $85.9 million of 24-hour Pons volume and $5.34 million of 24-hour fees at the 2026-08-31 access time.
      class: verified
      sources:
        - S3
        - S4
  risk:
    - text: Pons says its current allocation of 80% of protocol fees to a manual TWAP buyback is not immutable yet.
      class: claim
      sources:
        - S2
    - text: Team-reviewed community takeovers may redirect a token's creator-fee payout wallet when the deployed contracts permit it.
      class: claim
      sources:
        - S2
    - text: Graduation only records that a WETH threshold was reached; it is not a quality, liquidity or exit guarantee.
      class: claim
      sources:
        - S2
  missing:
    - text: Active factory and locker ownership, privileged roles and fee-recipient controls not yet reproduced onchain
    - text: Active deployment source verification and implementation map not yet captured from Blockscout
    - text: Independent audit report, covered commit and incident-response process not yet located
    - text: Public source repository and named technical contributors not yet located
  unresolved: []

