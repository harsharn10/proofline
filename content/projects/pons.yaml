summary: "Native launchpad on Robinhood Chain with two documented generations: v1 launches fixed-supply tokens straight into locked Uniswap V3 WETH pools; v2 sells from a bonding curve that graduates into a permanently locked Uniswap v4 pool and can pair against approved assets such as tokenised stocks. Per its docs v2 is deployed, creator-allowlisted and still under audit."
