slug: pons
name: Pons
symbol: PONS
category: Bonding-curve launchpad
lifecycle: mainnet
coverage: full
summary: "The chain's busiest launchpad by launches and volume today. Pons launches tokens on Robinhood Chain in two generations: v1 mints a fixed-supply token straight into a locked Uniswap V3 WETH pool; v2 sells from a bonding curve that graduates into a permanently locked Uniswap v4 pool and can pair against approved assets such as tokenised stocks. Users launch and trade from their own wallets. Pons Labs, LLC runs the site and @ponsdotfamily."
