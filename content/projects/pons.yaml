slug: pons
name: Pons
symbol: PONS
category: Launchpad
lifecycle: mainnet
coverage: stub
summary: "Robinhood Chain launchpad whose current factory creates fixed-supply tokens directly in locked Uniswap V3 WETH pools; graduation is a liquidity threshold, not a migration."
official_links:
  - kind: site
    url: https://ponsfamily.com
  - kind: docs
    url: https://docs.ponsfamily.com
dependencies:
  - uniswap
addresses:
  - label: Active factory
    address: "0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB"
    role: factory
    verified: false
    sources:
      - S2
  - label: Active locker
    address: "0x736D76699C26D0d966744cAe304C000d471f7F35"
    role: other
    verified: false
    sources:
      - S2
  - label: PONS token
    address: "0x39dbed3a2bd333467115de45665cc57f813c4571"
    role: token
    verified: false
