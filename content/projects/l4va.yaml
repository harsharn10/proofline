why_people_care:
  - The TGE page lists $L4VA exclusively on Robinhood Chain, with WETH as the sale currency, while GitBook still describes the vault machinery on Cardano. [claim S5 S9]
  - That is a native-play claim for chain 4663 that is not yet a live factory. [claim S5 S9]
  - Ticker-named L4VA ERC-20s already trade on 4663, including a Pons v2 L4V4/ETH Uniswap pair. [verified S14 S17]
