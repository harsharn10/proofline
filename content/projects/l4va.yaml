        - S4
    - text: "Receipts: l4va.org/tge HTML and JS, l4va.com HTML and JS, app.l4va.org, GitBook markdown, X profile and five posts, GitHub org and user, Discord invite API, GlobeNewswire reprint, Blockscout API v2, RPC, DexScreener were opened on 2026-09-03; excerpts are copied from those pages. [verified R-1 R-2 R-4 R-10 R-12] - Numbers: $1,050,000 is the TGE page stated market cap, not a live chain-slice TVL. DexScreener 4514.01 is L4V4/ETH liquidity.usd on pair 0x531343…b1a0, not an official $L4VA pool. Bytecode lengths are eth_getCode on 4663. [claim R-1] [verified R-12 R-13] - Adversarial: the strongest contrary reading is that one of the 50 L4VA-named ERC-20s is the official token. The TGE FAQ says the presale address is unpublished; those hashes are absent from the TGE JS; two of the reproduced tokens were created by Pons factories."
