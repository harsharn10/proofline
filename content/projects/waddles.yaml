summary: A one-billion-supply ERC-20 launched on Pons v2 and graduated into a Uniswap v4 pool quoted against Amazon • Robinhood Token (AMZN). PonsV2LaunchFactory.launchToken on 2026-08-29 minted Waddles (WADDLES) into a bonding curve, then createGraduatedPool seeded the WADDLES/AMZN book and locked leftover supply plus the LP NFT. Traders buy and sell WADDLES against AMZN. AMZN is the quote rail, not the subject. No bidirectional official handle was located this pass.
