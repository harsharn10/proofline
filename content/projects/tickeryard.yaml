summary: "TickerYard mints yBTC on Robinhood Chain as an 8-decimal receipt of Arbitrum WBTC: a user sends WBTC through tickeryard.com and receives yBTC (site: 0.30% wrap fee, about 18 minutes). YAssetGateway is the only minter. $YARD is the Anvil ERC-20 paired with 3,333 Yardkeeper NFTs. @TickerYardHQ lists tickeryard.com."
