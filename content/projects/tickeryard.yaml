  risk:
    - text: "Receipts: tickeryard.com, the paper URL, @TickerYardHQ profile and listed posts, Anvil market UI, StonkBrokers partner line, Blockscout token/gateway/vault/create txs, RPC, DexScreener, and GeckoTerminal were opened on 2026-09-03 and excerpts copied from the responses. [verified R-1 R-4 R-5 R-11] - Numbers: YARD holders 5302 and yBTC holders 2254 are Blockscout counts. Volume 124536 is the YARD/WETH up pair 24h bar, not an all-chains total. yBTC supply 1.21238693 is `totalSupply` / 1e8. GeckoTerminal market cap 1855735 is not the DexScreener fdv 2426304. [claim R-12 R-17] [verified R-4 R-5 R-11] - Adversarial: the strongest contrary reading is that TickerYard is only an Anvil NFT mint and that yBTC is a ticker copy. Verified names YAssetReceipt / YAssetGateway, originAsset WBTC on 42161, DexScreener websites tickeryard.com, and matching official posts argue the wrap is the live product; copycat CAs remain listed under ca-collision."
      class: inference
      sources:
        - S9
        - S10
        - S16
    - text: "Gateway owner is one EOA with pause and peer-proposal functions; Arbitrum WBTC lock was not reproduced. [verified R-11] - Yardkeepers NFT source is unverified; collection owner is a second EOA. [verified R-7] - Name collision: other ERC-20s use TickerYard / Yardkeeper / $YARD at different addresses. Flag: ca-collision. [verified R-4 R-12] - No audit report was located this pass. [unknown] - Wrap fee 0.30% is a site figure; it is not a named `wrapFeeBps` on the gateway ABI."
      class: claim
      sources:
        - S5
  missing:
    - text: Mainnet status rests on the project's own posts; not independently verified
    - text: yBTC and YARD addresses not located
    - text: Bridge and custody path for the BTC backing
    - text: Mint and redeem controls
    - text: An independent audit was not found in this review
    - text: "Where is Arbitrum WBTC locked, and does gateway creditInvariant 1.21238693 yBTC match the remote vault balance? Next: read YAssetBridgeCore peers/vaultAssets for selector 4949039107694359620 and eth_call the Arbitrum vault"
    - text: "Can gateway owner 0x04D870… pause, change peers, or mint without the 172800-second delay, and who holds NFTAMMVault DEFAULT_ADMIN_ROLE? Next: eth_call hasRole for treasury 0xb668… and getRoleMember if present; read pause modifiers in YAssetBridgeCore"
    - text: "Is the 0.30% wrap fee in the gateway, the Arbitrum vault, or only the site UI? Next: eth_call quoteBridgeBackFee and read the Arbitrum vault fee constant"
    - text: "Is there a yXAUT receipt on 4663, or is YXAUT_ID only a gateway constant? Next: receiptOf(YXAUT_ID) and Blockscout search yXAUT"
    - text: "Does any audit PDF cover YAssetReceipt.sol / YAssetGateway.sol compiler v0.8.36? Next: ask in public and match any named auditor report to the gateway bytecode"
    - text: "Does t.me/portaltickeryard cross-link tickeryard.com / @TickerYardHQ? Next: open the Telegram profile and compare the linked domain"
  unresolved:
    - text: The bridge and custody path for the BTC backing yBTC has not been described in either intake.
