findings:
  positive:
    - text: "The DETF package factories and the Uniswap v4 exchange package named in the app for chain 4663 exist and have explorer-verified source (DiamondPackageCallBackFactory, UniswapV4SingleStandardExchangeDETDFPkg, Create3Factory, UniswapV4HookDiamondPackageCallBackFactory)."
      class: verified
      sources: [S4, S5, S9, S10, S8]
  risk:
    - text: "The fee-accruing DTF token is a PonsV2LauncherToken whose launchFactory is the canonical Pons v2 factory: it is a Pons launch, not a separately documented DETF contract, and its curve is a Pons v2 bonding curve."
      class: verified
      sources: [S3, S6]
    - text: "owner() on Create3Factory and on both diamond proxies (indexedexManager, feeCollector) returns the deployer 0x72Be…933B, a single externally owned account; the DETF package layer is controlled by one key with no multisig or timelock located."
      class: verified
      sources: [S17, S13, S8]
    - text: "The app footer shows audits as pending and no audit report was located; the indexedexManager and feeCollector addresses are proxies whose implementations were not read."
      class: claim
      sources: [S2, S11, S12]
  missing:
    - text: "Whether any DETF basket has been created and bonded on chain 4663, or the verified package contracts are unused until a documented product open."
    - text: "Implementation contracts behind the indexedexManager and feeCollector proxies, and who can upgrade them."
    - text: "Fee path from DETF activity to the DTF token, as documented and as deployed."
  unresolved:
    - text: "Lifecycle: the site marks the protocol Live and its chain-4663 package contracts exist with verified source, but no DefiLlama protocol row and no bonded DETF were found; recorded as announced with the conflict open (packet CON-1)."
