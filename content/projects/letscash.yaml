risks:
  - The factory is a UUPS proxy whose current implementation is unverified, so the upgrade path is held by the owner Safe. [claim S1]
  - Liquidity removal is rejected by the hook, so a failed launch cannot be unwound by pulling LP. [claim S1]
  - Platform fees buy CASHCAT; that is not the same object as the CASHCAT token. [claim S1]
