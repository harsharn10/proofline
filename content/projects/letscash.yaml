summary: A Uniswap v4 launchpad on Robinhood Chain. One transaction mints a fixed-supply token into a locked v4 pool; a custom hook taxes the quote leg in ETH or USDG, pays the creator, and sends a 0.3% platform share into CASHCAT buys. No bonding curve and no migration. letscash.fun and @letscashfun run it. Distinct from the CASHCAT token.
