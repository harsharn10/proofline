summary: A one-billion-supply ERC-20 launched on Pons v2 against MSFT, then graduated into a Uniswap v4 DIH/MSFT pool. PonsV2LaunchAndBuy deploys dih (DIH) in one launch call (here wrapped in Multicall3), fills a bonding curve, and createGraduatedPool seeds the DIH/MSFT book. Traders buy and sell DIH on that Uniswap v4 pool. MSFT is the pair rail, not the subject. Distinct from CLIPPY/MSFT. No official site or handle was located this pass.
