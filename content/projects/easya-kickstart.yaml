summary: EasyA Kickstart is a permissionless ideas launchpad with a Robinhood Chain lane at kickstart.easya.io/robinhood. A launch creates a Uniswap v4 pool with one-sided locked liquidity. Creators pair against ETH or one of 24 listed stock tokens and claim about 1% of volume in the paired asset. The ETH factory is PumpFactory proxy 0x519f…273e; the stock factory is StockLaunchpad proxy 0x785d…5Fc1. The handle is @EasyA_Kickstart.
