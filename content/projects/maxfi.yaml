summary: No-swap concentrated-liquidity manager on Robinhood Chain. A deposit opens a per-user Uniswap v3 NFT; the vault rebalances by minting a new range from existing balances with no swap. Users deposit tokenized-stock and meme pairs at maxfi.tech. @MAXFILABS runs the Robinhood UI; DefiLlama labels the vault a Snuggle whitelabel.
