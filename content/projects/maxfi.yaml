        - S4
  risk:
    - text: MaxFi is not on the DefiLlama dump; its TVL and payout figures are the project's own and were not reproduced.
      class: claim
      sources:
        - S4
    - text: "Receipts: maxfi.tech, /security, /docs, /risks, @MAXFILABS profile and posts, Llama protocol/fees/revenue, the Snuggle adapter, Blockscout vault/impl/helper/adapter/ProxyAdmin/create tx, and RPC were opened on 2026-09-03 and excerpts copied from the responses. [verified R-1 R-4 R-6 R-11] - Numbers: TVL 4534836 is the Robinhood chain slice on protocol/snuggle, not the 9195133 all-chains last tvl and not the $9.14M project post. Fees 121834 and revenue 16710 are the Robinhood bars for 2026-09-02. [claim R-4 R-13 R-14 R-15] - Adversarial: the strongest contrary reading is that MaxFi is only a frontend on Snuggle and has no distinct deployment. Adapter comment MaxFi Robinhood, verified name SnuggleVaultUpgradeable, @MAXFILABS bio Powered By Snuggle, and the separate maxfi.tech / @MAXFILABS surface argue they share the engine; they remain separate slugs."
      class: inference
      sources:
        - S8
        - S10
        - S11
    - text: One EOA owns the vault and the ProxyAdmin. [verified R-11] - Robinhood TVL in the Snuggle Llama module is the MaxFi-labeled vault; there is no protocol/maxfi row. [verified R-4 R-5] - Security page states V30 used AI analysis tools; homepage and an official post name Valves/Valve Security; Abyss.pdf was not matched to the Robinhood bytecode this pass. [claim R-1 R-2 R-17] - No-swap rebalance still leaves range and impermanent-loss path risk; /risks says IL is reduced, not eliminated. [claim R-21] - /docs still describes the protocol as built on Base.
      class: claim
      sources:
        - S25
