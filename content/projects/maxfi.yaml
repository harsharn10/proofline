  - DefiLlama has no MaxFi protocol row; the Snuggle adapter's Robinhood chain slice is the MaxFi-labeled vault 0x1195…6DCE. [claim S6]
  - That slice is the live book for tokenized-stock LP on chain 4663. [claim S6]
