        - S18
        - S22
    - text: "Shared Doppler/Airlock stack: Bankr-launched tokens have the same `owner()` as other Doppler clones, including LONG-path tokens. [verified R-16 R-13] - Vesting recipient cannot be moved after launch; fee-recipient transfer does not move the vested allocation. [claim R-1] - $GOON and $GOONER are different contracts and different factories. Flag ca-collision. [verified R-11 R-13] - No audit report for the Robinhood factory was located this pass."
      class: unknown
