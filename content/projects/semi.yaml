summary: SEMI is an ERC-20 that trades in one Uniswap v4 pool against Robinhood's tokenized Micron (MU). Swaps pay a 5% hook fee converted to MU; staking earns ratchet mints only when MU backing per token makes a new high; bonding sends MU into the locked book for discounted SEMI. SemiVault at semivault.xyz / @Semivaultxyz publishes the token 0x5F03…BaC8 and the verified contract set.
