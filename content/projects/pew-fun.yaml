summary: Pew.fun launches tokens straight into a locked SushiSwap or Uniswap v3 pool on Robinhood Chain. There is no bonding curve and no graduation; the token is tradeable from block one. The Emerson-mapped factory is 0xC9182C…9D8c. The site also lists later instant factories, stock-quote factories, and fixed-price launch parties. The handle is @pewdotfun; the site is pew.fun. The X bio currently reads (former) Robinhood Launchpad.
