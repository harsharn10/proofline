summary: A multi-mode token launchpad on Robinhood Chain. Classic mints a 1B-supply token into a locked Uniswap v3 1% pool in the same transaction; Pump Curve, Fair Drop and Celebrity Vault are additional modes, and stock-priced Classic pairs against any of 194 Robinhood stock tokens. Creators keep 50% of the 1% pool fee. Current comms are @dontblink_cto on dontblink.community; the original handle @dontblinkfamily remains a separate signer. $BLINK is the platform token.
