summary: Floor is a Pons-graduated token on Robinhood Chain. The official site says a 2% creator tax on $FLR trades buys a basket of tokenized equities, with half claimable by holders and half held as a redeemable floor. The site publishes the token, vault, and distributor addresses on chain 4663. RPC this round reproduced the FLOOR/FLR ERC-20 and a vault whose token() returns that address. Distinct from The Index.
tldr: "Pons-graduated $FLR on chain 4663: a 2% trade tax is stated to buy tokenized equities; token, vault, and distributor contracts exist [CLM-1 CLM-3 CLM-4]."
