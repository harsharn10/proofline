summary: Reserve-backed currency on Robinhood Chain. NET is minted only by the Treasury, staked into rebasing sNET every 8 hours, and sold through bonds against a USDG reserve plus protocol-owned NET/USDG liquidity. Users buy NET/USDG, stake for dividends, or subscribe to bonds and RWA programs at netnet.capital. NetNet Capital Management (@NetNetCap) publishes the contracts; tax-pair adds sit with Safe 0x3Bb7…5f42.
