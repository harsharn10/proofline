summary: "Trench is a bonding-curve token launchpad at trench.today. A launch mints a fixed-supply ERC-20 onto a constant-product curve, then migrates automatically into a DEX pool when the curve fills. On Robinhood Chain the live factory is BondingCurveFactory 0x2ECFb98B…FbAA. Docs: new graduates go to Uniswap V4 with a Trench fee hook; older graduates stay on Uniswap V3. The handle is @TrenchToday01."
