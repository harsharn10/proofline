findings:
  positive:
    - text: The official account posted on 29–30 Aug that TVL had surpassed $1,000,000, that $400,000 had been claimed by LPs and that the token had 10,000 holders.
      class: claim
      sources:
        - S5
        - S4
    - text: "Receipts: deltaliquidity.app/pools, /docs, X profile and six posts, Aster listing, Blockscout token/tx/factory/pair/VaultFactory/PositionBuilder and the other DELTA token, DexScreener both CAs, Gecko pool, Llama protocol and adapter, and RPC calls were opened on 2026-09-02 and excerpts copied from the responses."
      class: verified
      sources:
        - S9
        - S10
        - S12
        - S17
        - S19
        - S21
    - text: "Numbers: DexScreener liquidity and 24h volume are Uniswap v3 DELTA/WETH 0xD64Fbd…, not all DELTA pairs. Llama TVL is the Robinhood Chain custodied slice. Site $1,440,933 and X $1,000,000 claimed remain class claim. Holders 14292 is all token holders."
      class: claim
      sources:
        - S13
        - S17
        - S19
  risk:
    - text: "Adversarial: the strongest contrary reading is that Gecko trending DELTA/WETH is the other Robinhood DELTA (0xfA1A…bD5, ~$4.5M reported liq) or Ethereum Delta Financial (Llama slug delta-financial, 0x9EA3…). Trending pool 0xd64fbd… has base 0xe8ff…a791; 0xfA1A… 24h volume is $0.04; Llama slug delta points at deltaliquidity.app. A weaker contrary reading is that Delta is only a Pons memecoin: the token is a Pons launch, but docs-listed vault and ladder contracts exist with code on 4663."
      class: inference
      sources:
        - S18
        - S19
        - S29
        - S35
    - text: Site TVL, Llama TVL and the DELTA/WETH book are three different numbers.
      class: claim
      sources:
        - S9
        - S17
        - S19
    - text: Vault and ladder owners are EOAs; most protocol source is unverified, so the FAQ pause/fee limits are unproven. [verified R-13]
      class: claim
      sources:
        - S10
    - text: Docs list DeltaLadderManager v3 0x5cA6… while Llama still reads 0x6468… and 0xC594….
      class: claim
      sources:
        - S10
        - S20
    - text: No audit report was located.
      class: unknown
    - text: A second Robinhood DELTA ticker (0xfA1A…bD5) can be mixed with this product.
      class: verified
      sources:
        - S29
  missing:
    - text: Token address from the bio not reproduced on Blockscout
    - text: Vault and manager contracts not located
    - text: Withdrawal and rebalance powers
    - text: TVL claim ($1M+) versus DefiLlama ($16k) unresolved
    - text: An independent audit was not found in this review
    - text: Official site not located
    - text: "Which ladder manager is live for new positions: docs DeltaLadderManager v3 0x5cA6…295D, Llama LADDER_MANAGER 0x6468…FeD4, or LADDER_MANAGER_V2 0xC594…B418? Next: read the app's configured manager address from JS and match open events"
    - text: "Do the unverified VaultFactory / DeltaLadderManager sources match the FAQ (owner can pause and lower fee, cannot raise fee or move deposits), and is there a timelock? Next: verify source on those contracts or eth_call pause/fee setters"
    - text: "Is there an audit report whose scope matches VaultFactory, ladder managers and DeltaPositionBuilder? Next: record any report URL as a claim when published"
    - text: "Can site TVL $1,440,933 be reconstructed as the sum of user-custodied Uniswap positions the app indexes, versus Llama's $13,804 custodied slice? Next: sum position NFT amounts the app lists, or ask Llama to add a user-custodied metric"
    - text: "Does anyone still operate deltaliquidity.xyz, and is the constructor website field updated on chain? Next: leave as stale constructor metadata unless DNS returns"
    - text: "Is 0xfA1A…bD5 connected to this team, or only a ticker collision? Next: leave unmerged unless a primary post links the two CAs"
  unresolved:
    - text: DefiLlama listed Delta at about $16,201 TVL on 2026-08-31 against the project's $1M+ post; Proofline could not tell whether the Llama row is stale or covers a different product slice.
    - text: economics.metric remains unresolved (CON-1).
