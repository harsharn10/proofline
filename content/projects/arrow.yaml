findings:
  positive:
    - text: On 2026-08-31 the official account announced that Arrow CDP v1 was live, and the official app showed Robinhood Chain markets, outstanding aUSD, collateralization and stability-pool balances without requiring a connected wallet.
      class: claim
      sources:
        - S9
        - S13
    - text: "The official account posted pre-open parameters: 16 collateral markets (stables, WETH, tokenized equities and indices), 75–90% initial maximum LTV, about $1.6M aggregate aUSD borrow cap, and equity or index collateral usable only during US cash hours (09:30–16:00 ET) with WETH and stables 24/7."
      class: claim
      sources:
        - S5
    - text: The official account posted on 2026-08-29 that the stability pool had been rewritten into risk-tiered pools so an equity shortfall cannot reach stablecoin or wstETH providers, following a Sherlock review.
      class: claim
      sources:
        - S6
    - text: Both the ARROW token (6,886 holders, contract source code verified on Blockscout) and aUSD (21 holders, source code not verified on Blockscout) are present on chain 4663 with the same creator. That is the explorer's own source-code flag, not independent Proofline verification.
      class: claim
      sources:
        - S7
  risk:
    - text: The aUSD contract was reported on Blockscout without its source code verified on the explorer; the CDP's own contracts were not located in this review.
      class: claim
      sources:
        - S7
    - text: Two further X accounts using the Arrow name (@ArrowFinanceHQ, @arrowfinances) were flagged by the research desk as unconfirmed; only @ArrowFinanceio is treated as the project's account in this file.
      class: claim
      sources:
        - S8
    - text: "The workbook records unrelated products using the Arrow name on this chain: a Solana-origin token launcher (launcharrow.xyz) and the separate Arrows options protocol."
      class: claim
      sources:
        - S4
    - text: "Receipts: site, both docs pages, buy page, borrow app, X profile and named status URLs, Linktree, Telegram preview, GitHub 404, DexScreener pair and token APIs, DefiLlama protocol and chains APIs, and Blockscout address/token/source APIs were opened on 2026-09-02; excerpts are copied from those responses. [verified R-1 R-2 R-3 R-5 R-8 R-15] - Numbers: holders 7328 is the Blockscout ARROW token field; 24h volume 100896.87 USD and liquidity 3787458.75 USD are the DexScreener ARROW/WETH Uniswap v3 pair slice, not an all-pairs or all-chains total; borrow-app TVL 58257.41 USD is a site readout, not an on-chain sum of vaults; DefiLlama ArrowPad TVL is the pad adapter, not CDP TVL. [claim R-5 R-9 R-15 R-21] - Adversarial: the strongest contrary reading is that Arrow Finance is the launchpad (ArrowPad / ArrowPad.fun / Llama @RobinArrowPad) or that it is Arrows the options protocol. Official copy leads with the CDP; the Launchpad contract name is Launchpad, not a vault manager; token CAs, domain and handle do not match arrows.finance."
      class: inference
      sources:
        - S20
        - S27
        - S31
    - text: CDP core contracts are unlabeled, so liquidation, oracle, pause and cap paths are not reproduced. [claim R-2 R-4] - Launchpad owner is one EOA with no timelock on factory setters. [verified R-12] - Docs, the borrow app and the 8/30 post disagree on live market count and LTV. [disputed R-2 R-5 R-20] - aUSD explorer source is not verified; owner() on aUSD reverts. [verified R-10] - Sherlock is named in posts; no report is linked from official properties. [claim R-2 R-20] - ArrowToken source documents a buy/sell tax; owner is now zero, so the last on-chain tax setting is frozen and was not re-read.
      class: verified
      sources:
        - S44
  missing:
    - text: CDP core and stability-pool addresses not located
    - text: Sherlock report and covered commit not reviewed
    - text: Admin powers over caps, listings and the US-hours collateral switch
    - text: ArrowPad factory controls
    - text: "What are the vault-manager, stability-pool, liquidator, surplus-buffer and aUSD minter addresses on 4663? Next: read the borrow app's contract config or a mint transaction's to-address and open those contracts on Blockscout"
    - text: "Does a published Sherlock report cover the deployed CDP bytecode, and at which commit? Next: ask in public for the report URL and match bytecode to the reviewed commit"
    - text: "Which LTV and live-market set is on chain: docs 24 markets at 75/90/55/40, or the app's 70/80/50 with most equities Coming soon? Next: eth_call the unlabeled market contracts once addresses are known"
    - text: "Why is aUSD totalSupply 42332.58 while the borrow app showed 30435.19 outstanding? Next: split circulating, stability-pool, and unbacked supply from the minter once labeled"
    - text: "Is AccessRegistry currently allowing public createLaunchpadToken, or is the pad gated? Next: eth_call accessRegistry and isTokenCreationAllowed for a random caller; read getTokensCount"
    - text: "Are DefiLlama ArrowPad (@RobinArrowPad) and ArrowPad.fun (@Arrowpadfun) this factory 0x1Badc838… or separate pads? Next: diff Llama adapter addresses against 0x1Badc838…"
    - text: "Current buyTaxBps / sellTaxBps / taxWallet on ArrowToken after owner() went to zero Next: eth_call buyTaxBps(), sellTaxBps(), taxWallet(), pair(), tradingEnabled()"
