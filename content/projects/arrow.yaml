coverage: stub
summary: An overcollateralized CDP on Robinhood Chain. A user deposits one approved asset into a vault, mints aUSD against it, and repays to release the collateral. Docs list WETH, USDG and Stock Tokens as collateral. The same brand also runs ArrowPad, a bonding-curve launchpad. Official site arrowfinance.io and handle @ArrowFinanceio. Distinct from Arrows, the options protocol.
