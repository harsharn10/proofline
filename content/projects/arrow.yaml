      sources:
        - S5
    - text: The official account posted on 2026-08-29 that the stability pool had been rewritten into risk-tiered pools so an equity shortfall cannot reach stablecoin or wstETH providers, following a Sherlock review.
      class: claim
      sources:
        - S6
    - text: The desk's auditor reported both the ARROW token (source verified, 6,886 holders) and aUSD (source unverified, 21 holders) present on Blockscout 4663 with the same creator.
      class: claim
      sources:
        - S7
  risk:
    - text: The aUSD contract was reported on Blockscout without verified source; the CDP's own contracts were not located in this review.
      class: claim
      sources:
        - S7
    - text: Two further X accounts using the Arrow name (@ArrowFinanceHQ, @arrowfinances) were flagged by the research desk as unconfirmed; only @ArrowFinanceio is treated as the project's account in this file.
      class: claim
      sources:
        - S8
    - text: "The workbook records unrelated products using the Arrow name on this chain: a Solana-origin token launcher (launcharrow.xyz) and the separate Arrows options protocol."
      class: claim
      sources:
        - S4
  missing:
