    - text: CDP core and stability-pool addresses not located
    - text: Sherlock report and covered commit not reviewed
    - text: Admin powers over caps, listings and the US-hours collateral switch
    - text: ArrowPad factory controls
  unresolved:
    - text: "Whether the CDP opened at 09:30 ET on 2026-08-31: the desk's last check preceded the open and found no 'we're live' post. Lifecycle stays announced until an official post or on-chain activity is reviewed."
