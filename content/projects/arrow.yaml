findings:
  positive:
    - text: Arrow Finance publishes an official docs at https://app.arrowfinance.io/docs.
      class: claim
      sources:
        - S1
    - text: Arrow Finance publishes an official X account at https://x.com/ArrowFinanceio.
      class: claim
      sources:
        - S2
    - text: "The official account posted pre-open parameters: 16 collateral markets (stables, WETH, tokenized equities and indices), 75–90% initial maximum LTV, about $1.6M aggregate aUSD borrow cap, and equity or index collateral usable only during US cash hours (09:30–16:00 ET) with WETH and stables 24/7."
