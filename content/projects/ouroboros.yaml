summary: A fixed-supply ERC-20 on Robinhood Chain quoted against the CRCL Stock Token. OuroborosHook takes a 1% CRCL fee on Uniswap v4 swaps, forbids outside LP, and burns tokens from CRCL buybacks. A user buys or sells OUROBOROS on that pool. EOA 0x0130…4a90 deployed the token and hook; owner() reverts on both.
