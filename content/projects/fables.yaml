    - text: "Are FABLES, voting, gauges or emissions contracts deployed on 4663? Next: watch docs/addresses Deployment status and missing contracts and any TGE post from @fablesfi"
    - text: "Is there an independent audit artifact whose scope matches the live hooks? Next: record any later report whose commit and addresses match the deployed FablesRWA / FablesRampETH / AccessManager"
    - text: "Is there an official public repository for the verified FablesRWA / FablesPoolRegistry source? Next: record a GitHub org if the site or an official post links one"
    - text: "Does the Merkle distributor 0xC9Ec…8760 match the weekly USDG proofs, and who can set the root? Next: verify source and read setMerkleRoot / owner-equivalent"
    - text: "Do remaining docs-listed hooks (TSLA, AAPL, GLD, META, NVDA/SPY, SPY/GLD) share the same AccessManager? Next: eth_call authority() on each remaining hook"
  unresolved:
    - text: The workbook (30 Aug) described Fables as not launched with a PROLOGUE TGE cited for 5 Oct 2026, while Proofline's chain map and DefiLlama list it live with TVL and volume on 31 Aug. Which product is live has not been resolved.
    - text: communications.status remains unresolved (CON-1).
themes:
  - rwa
