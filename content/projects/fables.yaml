summary: A Uniswap v4 DEX whose hooks set market-specific swap fees. On Robinhood Chain, a user deposits a concentrated range, collects fees, and withdraws through fables.fi. $PROLOGUE is the live claim token, launched via pools.trade; FABLES staking, voting, and emissions remain planned. Alphix Association in Zug operates the interface.
