      class: claim
      sources:
        - S5
  risk:
    - text: "Receipts: official site, docs routes (live features, addresses, security/permissions, legal), X profile and named status URLs, DexScreener token API, DefiLlama protocol/dexs/fees APIs, and Blockscout address/tx APIs plus RPC eth_getCode/eth_call were opened on 2026-09-02; excerpts are copied from those responses. [verified R-1 R-2 R-3 R-8 R-16] - Numbers: TVL 6532113.77 USD is currentChainTvls['Robinhood Chain'], not an all-chains mix (Llama lists only that chain). Volume 18380793 and fees 19302 are the same adapter's 24h totals on that chain. Holders 7688 and circulating_market_cap 6497256.80 are Blockscout token fields. DexScreener 654540.72 USD is the PROLOGUE/ETH pair slice. Official $5M deposits is a project post, not the Llama slice. [verified R-9 R-16 R-17 R-19] - Adversarial: the strongest contrary reading is that Fables is not launched (workbook 30 Aug; TGE cited 5 Oct) or that it is up / SwapHood / Hookr / pools.trade. Docs and live hooks on 4663 argue the DEX is live and FABLES is what remains planned; official 19 Aug copy says no TGE date and names pools.trade only as the PROLOGUE launch path. Handles and domains do not match those other census rows."
      class: inference
      sources:
        - S12
        - S16
        - S22
    - text: AccessManager source is unverified; live roles, delay and queued operations were not eth_called. [verified R-11] - Fast keeper/pause roles can change fees inside bytecode bounds and pause one way; docs say a bad Merkle root can allocate weekly USDG incorrectly within its cap. [claim R-4] - No Fables-specific audit report is linked. [claim R-4] - FABLES, voting, gauges and the PROLOGUE redemption contract are not deployed; official channel says no TGE date is announced. A third-party post names 5 October 2026. [claim R-2 R-6 R-23] - PROLOGUE/ETH is hookless; holder flow on that pair is not a read of hooked-market activity. [claim R-3] - Stock-token issuers and Uniswap's protocol-fee controller can restrict or fee the legs independently of Fables.
      class: claim
      sources:
        - S14
  missing:
    - text: PROLOGUE address from the account bio not reproduced on Blockscout
    - text: Hook and gauge addresses unknown
    - text: ve escrow and emissions controls
    - text: An independent audit was not found in this review
    - text: Official site not located in the intake
