slug: robinhood-index-vaults
name: Robinhood Index Vaults
symbol: rIDX
category: RWA index vault
lifecycle: testnet-only
coverage: stub
summary: A testnet ERC-4626 vault that turns ETH into rIDX shares of a five-name stock-token basket. A user deposits ETH on Robinhood Chain testnet (chain id 46630); the vault wraps to WETH and swaps into PLTR, AMD, NFLX, AMZN and TSLA at 20% each through a mock router. nsvoud-dev publishes the contracts and a local Next.js app. Mainnet is listed as a later audit-and-launch phase.
