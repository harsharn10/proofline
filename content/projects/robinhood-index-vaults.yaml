  positive:
    - text: Proofline's chain map keeps Robinhood Index Vaults as testnet-only under rwa-products/index-vault with no official X handle found.
      class: claim
      sources:
        - S2
    - text: "Receipts: GitHub README, Hardhat, IndexVault.sol, MockSwapRouter.sol, deploy/fund scripts, frontend chain config, repo and user APIs, two commits, Vercel 404, testnet explorer address/tx/search, and Blockscout 4663 address/search pages were opened on 2026-09-03; excerpts are copied from those responses. [verified R-1 R-2 R-3 R-13 R-16] - Numbers: holders_count 4 is the testnet token 0x04653b… slice, not a 4663 figure and not TVL. [claim R-13] - Adversarial: the strongest contrary reading is that a 4663 IndexVault search hit (INDEXVAULT 0xC6d1…, IndexVault 0xc6ff…, hMAG7 0x43e4…) is this product, or that census testnet-only is stale. Those 4663 contracts use different symbols, files and creators; repo CAs are empty on 4663; Hardhat has no 4663 network. [verified R-16]"
      class: claim
      sources:
        - S20
        - S21
        - S22
  risk:
    - text: MockSwapRouter is a fixed-rate test harness, not a production DEX. [verified R-4] - Owner can change the basket and force Safe Mode with no timelock. [verified R-3] - Eight unverified rIDX CAs on testnet; frontend vault address is not committed. [claim R-7 R-13] - GitHub homepage Vercel URL returns 404. [claim R-11] - No audit report located.
      class: claim
      sources:
        - S3
