summary: Fully collateralized European calls and puts on Robinhood Stock Tokens and ETH, issued as transferable ERC-1155s. A user buys a long or deposits stock, WETH or USDG into a maturity writer vault that escrows maximum loss. Calls settle in-kind; puts settle in USDG. arrows.finance and @arrowsonhood run the surface. Distinct from Arrow Finance, the CDP.
