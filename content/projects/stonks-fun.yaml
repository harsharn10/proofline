    - text: Factory and token addresses not located
    - text: Fee burn path not verified against contracts
    - text: An independent audit was not found in this review
    - text: Official site not located
    - text: "What is the furnace contract address for the posted 36.5% $STONKS treasury burn, and does STONKS.balanceOf(furnace) match that share? Next: read the screenshot on the builder post or scan STONKS transfers from the deployer around 2026-09-01T13:48Z"
    - text: "Who can call createBasket / change MAG7 weights / pause redeem on 0xd21cdd54… and MAG7, given unverified source? Next: eth_call owner/admin on factory and MAG7; decompile or wait for verified source"
    - text: "Is there an audit whose scope includes DopplerDN404, StonksLauncherV3, the basket factory, MAG7, or the furnace? Next: ask in public for a report URL and match bytecode"
    - text: "Why are DEGEN and SILICON totalSupply 0 if they were posted as flagship indexes, and does MAG7 hold the listed Stock Tokens 1:1? Next: eth_call assets() and balances of NVDA/AAPL/… on MAG7; watch a cashMint"
    - text: "Is StonksLauncherV3 still taking launch() after the basket rebrand? Next: count recent Launch logs on 0x2a71F10b…"
