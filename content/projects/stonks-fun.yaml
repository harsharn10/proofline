findings:
  positive:
    - text: The official account's bio describes a DN-404 launchpad powered by Doppler whose fees burn $STONKS; a 22 Aug post announced a rebrand toward RWA baskets.
      class: claim
      sources:
        - S3
        - S2
  risk:
    - text: The name sits next to StonkBrokers (NFTs, Anvil, STORMM); they are separate projects and separate rows here.
      class: claim
      sources:
        - S3
    - text: "Receipts: stonks.fun HTML and JS bundle, @stonksdotfun profile and five posts, two @nikshepsvn posts, Blockscout API v2 plus RPC for $STONKS, DN404Factory, StonksLauncherV3, MAG7/DEGEN/SILICON, basket factory, router and the Uniswap v3 pool, and DexScreener token-pairs were opened on 2026-09-03; excerpts are copied from those pages. [verified R-1 R-2 R-11 R-19] - Numbers: 24h volume and market cap are the STONKS/USDG pair slice, not an all-chains figure; MAG7 holders 1 is not $STONKS holders 141. [verified R-11 R-16 R-19] - Adversarial: the strongest contrary reading is that this is StonkBrokers, The Index, Solana StonkFun, or still only an announced pad. Official CA, DopplerDN404 source name, StonksLauncherV3, createBasket MAG7 and the stonks.fun JS map argue against those merges; census announced is below the reproduced 4663 bar."
      class: inference
      sources:
        - S8
        - S14
        - S18
        - S19
    - text: Basket factory, MAG7, DEGEN, SILICON and the cash-redeem router have unverified source; createBasket is callable by the same EOA that created $STONKS. [verified R-17 R-22 R-23] - DEGEN and SILICON supply is 0; MAG7 has one holder. A card that treats three flagship indexes as traded books would overstate activity. [verified R-16 R-19 R-24 R-25] - The posted 36.5% treasury burn is a social claim until the furnace address is reproduced. [claim R-6 R-10] - No audit report was located in this review.
      class: unknown
  missing:
