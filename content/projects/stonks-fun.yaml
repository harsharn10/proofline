summary: Onchain index baskets of Robinhood stock tokens. A user picks holdings, sets weights, and mints one ERC-20 that is fully backed and redeemable in kind. MAG7, DEGEN and SILICON are live; the builder is open. Fees burn $STONKS. @stonksdotfun runs stonks.fun. $STONKS is a Doppler DN-404 from the earlier Uniswap v3 pad.
