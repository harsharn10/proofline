summary: A fee-routing layer on top of Robinhood Chain launchpads. Creators launch through Sinjoh on Pons, Flap, pools.trade or LetsCash; collected fees hit a per-launch router that splits, swaps, airdrops, burns or adds liquidity on a config locked at deploy. Holders of customer tokens receive those routed assets. INJOH is the protocol token, launched on Pons. sinjoh.com and @SinjohDeFi run the surface.
