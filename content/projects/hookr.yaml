risks:
  - Both launchpads are Ownable with two-step handover and no timelock, so fee, timing, and protocol-fee withdrawal can move when the owner key moves. [claim S7]
  - Docs state there is no independent audit. [claim S7]
  - Generation 3 and generation 5 contracts are both live; GitHub still tables generation 3 as the live deployment while docs name V5. [claim S7]
tldr: Hookr composes Uniswap v4 hooks on Robinhood Chain.
tldr_source: derived
why_people_care:
  - "Hookr is the chain's programmable Uniswap v4 hook marketplace: pool rules (anti-snipe, surge fees, auto-burn, LP rewards, Nth-buy pot) are the product, and a new token is how those rules… [claim S7]"
  - That is a different job from Pons, which sells supply along a curve. [claim S7]
  - The official account posted that Uniswap routing now considers Hookr-built hooked pools. [claim S7]
