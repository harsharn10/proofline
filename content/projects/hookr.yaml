    - text: "Receipts: official site, docs, X profile and status URLs, GitHub README, DexScreener token API, DefiLlama protocol URL, and Blockscout address/tx APIs were opened on 2026-09-03; excerpts are copied from those responses. [verified R-1 R-2 R-3 R-4 R-5 R-6 R-7 R-8 R-9 R-14 R-15 R-17] - Numbers: holders 5412 is the Blockscout token field; 24h volume 2560204.85 USD and liquidity 625860.84 USD are the DexScreener HOOKR/ETH v4 pair slice, not an all-pairs or all-chains total; DefiLlama has no Hookr protocol TVL. [claim R-3 R-14 R-19] - Adversarial: the strongest contrary reading is that Hookr is the chain's pad competitor (Pons-class) or that it is HookOS / What The Hook / pools.trade. Official copy names a hook marketplace, states independence from pools.trade, and uses different handles from HookOS and WTH; $HOOKR's own pool is hookless and was created on LiquidityLauncher, which cuts the other way — the project token is not a HookrLaunchpad graduate."
      class: inference
      sources:
        - S7
        - S14
        - S23
    - text: Owner is an EOA path with two-step handover and no timelock on fee, timing, and protocol-fee withdrawal. [inference R-4 R-16] - Docs and GitHub state there is no independent audit. [claim R-15 R-16] - Two launchpad generations are live; GitHub still tables generation 3 as live while docs name V5. [disputed R-2 R-15] - New website launches were posted as paused on 2026-09-02 during a modular contract move. [claim R-9] - Hook rules cannot be changed on a live pool; a parameter error is permanent for that token. [claim R-16] - $HOOKR's listed market is hookless and was launched on LiquidityLauncher, so holder flow on that pair is not a read of hooked-pool activity.
      class: verified
      sources:
        - S7
        - S23
