summary: The chain's stock-paired token factory. A user deploys a new ERC-20 through LongLauncher, which forwards an Airlock create after a 24-hour ticker lock and quotes the token against a Robinhood stock token in a Uniswap v4 pool. The same app lists $AI/NVDA, $BONER/HIMS and $SPACEHOOD/SPCX. @longdotxyz runs it at app.long.xyz.
