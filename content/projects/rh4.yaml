summary: A one-billion-supply ERC-20 cloned onto a Pons v2 bonding curve and graduated into a Uniswap v4 pool quoted against native ETH. PonsV2LaunchFactory deploys rh4.cpu (RH4) in one launch call and, after the 4.2 ETH threshold, seeds the RH4/ETH book. Traders buy and sell RH4 on Uniswap v4. The same deployer EOA also published ChipFactory8, an ERC-721 the site treats as on-chain chips.
