summary: A native AMM on Robinhood Chain with a SwapHood V2 constant-product factory and a PancakeV3Factory for concentrated liquidity. A user swaps or deposits into pools, stakes LP for HOOD, and can convert HOOD to xHOOD/h33 for fee buybacks. @SwapHoodFi runs it at swaphood.finance.
