review:
  researcher: harsharn10
  approver: pending
  methodology_version: proofline-v1.0
  reviewed_at: 2026-08-31
  published_at: null
findings:
  positive:
    - text: SwapHood publishes an official X account at https://x.com/SwapHoodFi.
      class: claim
      sources:
        - S1
    - text: The official account describes a flywheel of HOOD emissions (about 2,375 per day, 5M maximum) to LPs, protocol fees used for HOOD buybacks (633.93 HOOD for 0.012 ETH on 2026-08-28) and buybacks raising the backing of h33; the team states it holds no HOOD and no LP.
      class: claim
      sources:
        - S3
    - text: The desk's auditor reported the HOOD token present on Blockscout 4663 with 395 holders and its contract source code verified on the explorer (per the desk, not Proofline verification), and DefiLlama lists SwapHood V3 with about $126–130k 24h volume.
      class: claim
      sources:
        - S5
        - S4
  risk:
    - text: The token's HOOD ticker is also the ticker of the Robinhood-issued HOOD Stock Token at a different address; the two are unrelated.
      class: claim
      sources:
        - S5
    - text: The V3 factory is named PancakeV3Factory on the explorer with the same deployer as the token; the AMM is a PancakeSwap fork rather than the canonical Uniswap deployment.
      class: claim
      sources:
        - S5
        - S2
  missing:
    - text: Addresses reported by the desk not reproduced here
    - text: Emissions controller and buyback executor
    - text: An independent audit was not found in this review
    - text: Docs URL (referenced as a gitbook without a link)
  unresolved:
    - text: The h33 token and V2 factory addresses come from the project's gitbook and were not checked on the explorer by the desk.
