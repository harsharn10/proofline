findings:
  positive:
    - text: The official account describes a flywheel of HOOD emissions (about 2,375 per day, 5M maximum) to LPs, protocol fees used for HOOD buybacks (633.93 HOOD for 0.012 ETH on 2026-08-28) and buybacks raising the backing of h33; the team states it holds no HOOD and no LP.
      class: claim
      sources:
        - S3
    - text: The HOOD token is present on Blockscout 4663 with 395 holders and its contract source code verified on the explorer — the explorer's own flag, not independent Proofline verification — and DefiLlama lists SwapHood V3 with about $126–130k 24h volume.
      class: claim
      sources:
        - S5
        - S4
    - text: "Receipts: swaphood.finance HTML, gitbook Welcome / Contract Addresses / Official Links / Tokenomics / Farms / Revenue Sharing, @SwapHoodFi profile and four posts, Blockscout API v2 for seven addresses plus three creation transactions, RPC eth_getCode/owner() at block 53080144, DexScreener HOOD pairs, and DefiLlama parent/V2/V3 plus fee and volume summaries were opened on 2026-09-03; excerpts are copied from those pages. [verified R-1 R-2 R-3 R-4 R-5 R-6 R-7 R-8 R-9 R-10 R-11 R-12 R-13 R-14 R-15 R-16 R-17 R-18 R-19 R-20 R-21 R-22 R-23 R-24 R-25 R-26 R-27 R-28 R-29 R-30] - Numbers: TVL, volume and fees are Llama Robinhood Chain slices, not all-chains totals. Holder count 407 is Blockscout `holders_count`. Bytecode lengths are eth_getCode at block 53080144. HOOD total supply 146,417 is `total_supply` / 1e18. [claim R-22 R-23 R-24] [verified R-13 R-20] - Adversarial: the strongest contrary reading is that this is imported PancakeSwap or the Robinhood HOOD Stock Token, or that it is census up / Fables. Explorer name PancakeV3Factory is a fork signal; creator and gitbook addresses are SwapHood's. HOOD here is SwapHood Token `0x1FcBc77a…`. up and Fables use different handles and tickers. [verified R-13 R-14]"
      class: claim
      sources:
        - S11
  risk:
    - text: The token's HOOD ticker is also the ticker of the Robinhood-issued HOOD Stock Token at a different address; the two are unrelated.
      class: claim
      sources:
        - S5
    - text: The V3 factory is named PancakeV3Factory on the explorer with the same deployer as the token; the AMM is a PancakeSwap fork rather than the canonical Uniswap deployment.
      class: claim
      sources:
        - S5
        - S2
    - text: HOOD and PancakeV3Factory `owner()` is one EOA; no timelock was found. [verified R-18 R-20] - Gitbook describes a 50% tax on xHOOD exit. [claim R-7] - Daily HOOD emission figures conflict across X and two gitbook pages. [claim R-5 R-6 R-10] - No audit report was located; Llama audits flag is 0. [claim R-23 R-24] - HOOD ticker collides with the Robinhood HOOD Stock Token at a different address. [claim R-13] - Gitbook Tokenomics 50% of revenue to HOOD buybacks is not the same split as Revenue Sharing 95% to h33.
      class: claim
      sources:
        - S12
        - S14
  missing:
    - text: Addresses reported during intake not reproduced here
    - text: Emissions controller and buyback executor
    - text: An independent audit was not found in this review
    - text: Docs URL (referenced as a gitbook without a link)
    - text: "Which on-chain daily HOOD emission is live: X ~2,375, Tokenomics 2,500, or Farms table 5,000? Next: eth_call reward rate / hoodPerBlock on Masterchef 0x734c9ef2… and V3 Masterchef 0x9d91AE1F…"
    - text: "Can owner 0xe49C113a… mint HOOD, change farm weights, or redirect buybacks without a timelock? Next: read verified source modifiers for mint, setOwner, setPoolSwapFee, collectProtocol"
    - text: "Which contract executes the posted 633.93 HOOD / 0.012 ETH buybacks, and does a 2026-09-02 tx match the post? Next: search HOOD transfers of 633.93 around 2026-09-02 and 2026-08-28"
    - text: "Does Tokenomics 50% of protocol revenue to HOOD buybacks match Revenue Sharing 95% to h33? Next: read fee-split in verified PairFeesV3 0x626A38d4… and Masterchef"
    - text: "Is there an audit whose scope matches the Robinhood V2/V3 bytecode? Next: search auditor report indexes for SwapHood and the PancakeV3Factory deploy"
    - text: "Gitbook Token Validator address 0xd69CAF31E52942a5519fd485CEDD0e7399B52c8 is 39 hex characters. What is the live address? Next: ask the project in public or match a 40-character TokenValidator on Blockscout from the same deployer"
    - text: "Are V2 Router 0x8F8056FE…, V3 Router 0x52909af7…, Masterchef 0x734c9ef2… and V3 Masterchef 0x9d91AE1F… the live swap and farm entry points? Next: Blockscout API v2 names and is_verified for those four, plus one swap tx to each router"
  unresolved:
    - text: The h33 token and V2 factory addresses come from the project's gitbook and were not checked on the explorer in this review.
    - text: economics.metric remains unresolved (CON-1).
