findings:
  positive:
    - text: "The official account posted isolated markets on Morpho Blue: GLD/USDG on 2026-08-24 with a 62.5% maximum LTV and a Uniswap V3 TWAP oracle, RDDT/USDG on 2026-08-26 at 38.5% LTV, and PONS/USDG for borrowing USDG against PONS; Proofline places the product as a Morpho + Pons credit overlay."
      class: claim
      sources:
        - S6
        - S5
    - text: The workbook records a lending fee split of 35% treasury, 30% USDG vault, 25% buyback and burn, 10% stakers, and zero-fee flash loans.
      class: claim
      sources:
        - S4
    - text: The official account posted on 2026-08-30 that TVL had crossed $100,000.
      class: claim
      sources:
        - S3
        - S7
    - text: "Receipts: www.longbow.cash HTML and JS, docs.longbow.cash, X profile and named status URLs, t.me/longbowlend, Blockscout address/token/tx APIs, DexScreener token-pairs, Longbow `/api/stats` `/api/markets` `/api/v2/vaults` `/api/stats/rich`, DefiLlama protocol/longbow (400), github.com/LongbowFinance (404), and RPC eth_getCode/eth_call were opened on 2026-09-02; excerpts are copied from those responses."
      class: verified
      sources:
        - S9
        - S13
        - S15
        - S16
    - text: "Numbers: 588602.3 USD is `/api/stats` tvl on chainId 4663, not a DefiLlama row; 832979.57 USD is DexScreener Uniswap v4 BOW/SPY volume.h24, not an all-pairs or all-chains total; 5753 is Blockscout holders_count; 500000 USD is an official post, not the API print."
      class: claim
      sources:
        - S14
        - S15
        - S16
        - S34
  risk:
    - text: The official account's 2026-08-30 post gave an Ethereum-cashtag address (0x07f5b682…) as the Pons token; Proofline found that address is not a contract on chain 4663. Addresses in the project's posts should not be copied without a check.
      class: claim
      sources:
        - S6
    - text: The BOW ticker is also used by the bow.fun launchpad and by a Bankr-launched token at 0xf56D9aDAA11dc278638adcDCA8Cf697DDC008ba3; only the address above is treated as Longbow's token.
      class: claim
      sources:
        - S4
        - S3
    - text: "Adversarial: the strongest contrary reading is that Longbow is LONG, Longshot, bow.fun or the Doppler BOW clone, or that census `announced` still holds because Morpho marketIds were not eth_called. Token name Longbow, PonsV2LauncherToken source, Uniswap v4 BOW/SPY book, and site↔handle cross-link argue against a merge; the pool and token on 4663 meet the mainnet bar even while market-id params stay API claims."
      class: inference
      sources:
        - S11
        - S13
        - S15
        - S28
    - text: Official `/api/markets` lists GLD/USDG at 38.5% LLTV after the 24 Aug post said 62.5%; Morpho market parameters are immutable, so this may be a different marketId.
      class: disputed
      sources:
        - S17
        - S31
    - text: PONS/USDG utilization is 1 on the API (51769.68 USDG borrowed against the same supply).
      class: claim
      sources:
        - S17
    - text: "Official posts tagged `ethereum:0x07f5b682…` as PONS; that address has no code on 4663. Flag: wrong-chain, ca-collision."
      class: verified
      sources:
        - S29
        - S32
    - text: Core USDG vault source is unverified; v1 MetaMorpho and staking are owned by one EOA with no timelock found.
      class: verified
      sources:
        - S20
        - S21
        - S22
    - text: No Longbow overlay audit report was located; Morpho Blue audits named in site copy cover the settlement primitive. [claim R-2]
      class: unknown
    - text: "Same-ticker BOW `0xf56D9aDA…` is a different contract. Flag: ticker-only."
      class: verified
      sources:
        - S28
  missing:
    - text: Mainnet status rests on the project's own posts; not independently verified
    - text: BOW address not reproduced on Blockscout
    - text: Morpho market ids and oracle contracts unknown
    - text: Fee-split enforcement not verified against contracts
    - text: An independent audit was not found in this review
    - text: TVL figures ($100k per the project on 2026-08-30; $58.6k per a third party on 2026-08-29) not reproduced
    - text: "Do the /api/markets Morpho marketIds (PONS 0xaba3ac50…, SPY 0x50bc39b5…, GLD 0x6c12c025…) match Morpho.idToMarketParams on 0x9D53d5…, and is GLD 38.5% a new market or a relabel of the 62.5% post? Next: eth_call idToMarketParams for those bytes32 keys and compare lltv, oracle, loan and collateral"
    - text: "What is the verified source and allocator path of Core vault 0x026df18… and adapter 0xDA803813…? Next: read bytecode/selectors or wait for explorer verification; map adapter allocations to Morpho markets"
    - text: "Is there a Longbow overlay audit, or only the Morpho Blue and NFT-escrow reviews named in site copy? Next: open any report URL the project posts and match commit/address scope"
    - text: "Is the 35/30/25/10 lending fee split still encoded, and which contract enforces it? Next: read StakingRewards and vault feeRecipient 0xa4c8e4ed… transfers"
    - text: "Who are the three Safe owners, and is there a timelock in front of market creation or vault allocation? Next: label the three EOAs if they appear in verified source or a project post"
