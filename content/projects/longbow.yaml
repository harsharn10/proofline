summary: "Isolated Morpho Blue markets on Robinhood Chain: a user posts Stock Tokens, PONS or other collateral and borrows USDG without selling the position. Suppliers deposit USDG into Longbow-curated vaults that allocate across those markets. BOW is the protocol token, launched through Pons v2 and paired to SPY on Uniswap v4. @longbowlend runs longbow.cash."
