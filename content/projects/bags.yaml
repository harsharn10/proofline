summary: Bags is a bonding-curve token launchpad on Robinhood Chain at bags.fm. `BagsFactory.create` (or `createAndBuy`) deploys a fixed-supply ERC-20, a per-token bonding curve, and a fee-share contract in one transaction; 830M of 1B sells vs native ETH, then the raise plus remaining 170M migrate into a Uniswap v4 token/WETH pool with a Bags hook and locked LP. The RH factory is `0xe8Cc4431…Cb37`. Solana is a separate Bags venue. The handle used on GitHub and Llama is @BagsApp; the site is bags.fm.
