findings:
  positive:
    - text: DefiLlama listed up v3 with about $7.76M TVL and up v2 with about $700k, roughly $37.1M 24h volume and $72,972 24h revenue on 2026-08-31 per Proofline's chain map.
      class: claim
      sources:
        - S4
    - text: Arrow Finance posted that its aUSD liquidity had been moved to an up v3 pool ahead of its 31 Aug open.
      class: claim
      sources:
        - S6
    - text: "Receipts: site HTML, docs overview/security, JS bundle, X profile and six posts, Telegram, GitHub org and README, Blockscout API v2, RPC, DexScreener and DefiLlama chain-slice endpoints were opened on 2026-09-03; excerpts are copied from those pages. [verified R-1 R-3 R-4 R-9 R-10 R-18] - Numbers: TVL 10239463.22323 is api.llama.fi/protocol/up-v3 currentChainTvls Robinhood Chain, not an all-chains total; Llama lists only that chain. Bytecode lengths are eth_getCode at block 52997532. [verified R-18 R-10] - Adversarial: the strongest contrary reading is that this slug is Fables or SwapHood, or that StonkBrokers is the AMM. Official surfaces and reproduced factories differ; Stonk Exchange docs name up as the swap engine, not the other way around."
      class: claim
      sources:
        - S10
        - S12
  risk:
    - text: CLFactory owner is a 2-of-4 Safe; no timelock was reproduced on that path. [verified R-15] - GitHub snapshot is not claimed as live bytecode. [claim R-8] - No audit report URL was opened this pass. [unknown] - Combining Llama up-v2 and up-v3 TVL without labeling would mix two modules.
      class: claim
      sources:
        - S27
        - S30
  missing:
    - text: Factory, router and token addresses not located
    - text: Emissions controller and buyback executor unknown
    - text: Whether the AMM is a fork and of what
    - text: An independent audit was not found in this review
    - text: "Do Voter, Minter and VotingEscrow also return the 2-of-4 Safe as owner, and is there a timelock on emissions or gauge changes? Next: eth_call owner() with the correct selector on Voter/Minter/VotingEscrow verified source and read onlyOwner setters"
    - text: "Is there an audit report whose scope matches the chain-4663 bytecode? Next: open the rendered security table and any auditor URLs, then match commit/bytecode"
    - text: "What are the gauge factory and current epoch emission amounts on chain? Next: read Voter gauges() / Minter weekly emissions from verified source"
    - text: "Does the GitHub snapshot match deployed bytecode? Next: compare verified Blockscout source to up-contracts and up-slipstream trees"
  unresolved:
    - text: The HoodInsider recap's $200M+ cumulative volume and 220M UP burned (44%) are media claims not reproduced.
