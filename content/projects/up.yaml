summary: The chain's native ve(3,3) AMM. A user swaps or supplies liquidity in v2 full-curve or v3 concentrated pools, then stakes LP in gauges. Lockers of UP into veUP vote each epoch on which pools receive emissions and collect the staked-pool fees. @uponrh runs it at up33.xyz.
