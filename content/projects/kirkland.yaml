summary: A one-billion-supply ERC-20 launched on Pons v2 against COST, then graduated into a Uniswap v4 KIRKLAND/COST pool. PonsV2LaunchAndBuy deploys Kirkland (KIRKLAND) in one launchAndBuy call, fills a bonding curve, and createGraduatedPool seeds the KIRKLAND/COST book. Traders buy and sell KIRKLAND on that Uniswap v4 pool. COST is the pair rail, not the subject. No official site or handle was located this pass.
