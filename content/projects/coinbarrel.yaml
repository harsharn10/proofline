risks:
  - The V5 launcher and Hook are upgradeable ERC1967 proxies. owner() on both is one externally owned account with no code and no pending owner. [verified S13 S17] [claim S6 S8]
  - Docs say that EOA held six proxy-owner and upgrade roles at deployment. [verified S13 S17] [claim S6 S8]
  - The Simple V3 launcher still has code, so an integrator that posts to 0x985d…e46f is on a path docs mark as not a new-launch choice. [verified S13 S17] [claim S6 S8]
tldr: Coinbarrel is a token launchpad on Robinhood Chain.
