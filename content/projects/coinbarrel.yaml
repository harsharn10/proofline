summary: Coinbarrel is a token launchpad on Robinhood Chain. A launch creates a Uniswap V4 pool with a Coinbarrel Hook V5 in one transaction; there is no bonding curve and no graduation. Liquidity is minted into permanent custody. New launches go through the live V5 launcher. A Simple V3 launcher remains deployed for older markets. Creators can pair against ETH, USDG, or enabled stock tokens. The handle is @UseCoinbarrel; the site is coinbarrel.com.
