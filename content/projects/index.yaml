summary: A 3% ETH fee on Index/ETH pool trades buys a basket of Robinhood Stock Tokens and sends them to eligible holders. Users hold INDEX above a 10,000-token threshold, or Zap received stocks back into INDEX, to stay in the registry. @TheIndexFi runs theindex.finance, indices.theindex.finance and rwa.wtf. The Index is not a launchpad.
