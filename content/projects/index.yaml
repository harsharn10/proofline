review:
  researcher: harsharn10
  approver: pending
  methodology_version: proofline-v1.0
  reviewed_at: 2026-08-31
  published_at: null
findings:
  positive:
    - text: The project's 17 Jul writeup, as carried by the dossier, describes a 3% tax on trades funding Stock Token distributions every 15 minutes, with 75% of related fees buying tokenized stocks and 25% deepening liquidity.
      class: claim
      sources:
        - S6
        - S5
    - text: DefiLlama listed The Index with $24,321 24h and $151,043 7d revenue on 2026-08-31 per Proofline's chain map.
      class: claim
      sources:
        - S4
    - text: "Receipts: theindex.finance, indices.theindex.finance, X profile and four posts, two HoodInsider posts, Blockscout address/token/tx/source and PoolManager, DexScreener token API, Llama protocol and fees APIs, and the Llama adapter file were opened on 2026-09-03 and excerpts copied from the responses."
      class: verified
      sources:
        - S10
        - S11
        - S12
        - S13
        - S16
        - S18
    - text: "Numbers: DexScreener liquidity and 24h volume are the Uniswap v3 INDEX/WETH pair 0xD29893…, not all INDEX pairs. Llama fees/revenue are the Robinhood Chain slice. Site $1,524,526.02 and X $1,500,000 / $355,000 remain class claim. Blockscout 21645 holders is all holders; registry holderCount is 3779."
      class: claim
      sources:
        - S14
        - S16
        - S18
  risk:
    - text: A distribution funded by a trade tax scales with trading volume, so payouts shrink when volume does; the dossier flags that the hook whitelist and fee routing need a contract read.
      class: inference
      sources:
        - S6
    - text: "Adversarial: the strongest contrary reading is that INDEX is a generic tax token whose Stock Token story is marketing, or that it is a launchpad / Robindex / Robinhood Index Vaults. Verified source names IndexFeeHook and a StockDistributor registry, the creator is not a pad factory, and Robindex / robinhood-index-vaults do not share CA, domain or handle. The unresolved contrary point is which pool actually pays the 3% fee."
      class: inference
      sources:
        - S12
        - S13
        - S16
    - text: IndexFeeHook address is unpublished in the token source; the 3% each-way ETH tax is described for the Uniswap v4 Index/ETH pool while the lead book is Uniswap v3 INDEX/WETH. [verified R-3]
      class: claim
      sources:
        - S16
    - text: Token owner is one EOA with no timelock on the holder-registry setters.
      class: verified
      sources:
        - S12
    - text: Four Llama-listed distributors have code on 4663; which one is live, and whether its logs match the site total, was not opened on the explorer this pass.
      class: claim
      sources:
        - S25
    - text: No audit report was located.
      class: unknown
    - text: Distribution size follows taxed volume.
      class: inference
      sources:
        - S10
        - S12
  missing:
    - text: Token address from the dossier and workbook not yet reproduced on Blockscout
    - text: Distributor and hook contract addresses unknown
    - text: Who sets the tax and controls the basket
    - text: Distribution totals (about $1M per the project) not reproduced on chain
    - text: "What is the live IndexFeeHook address, and which INDEX pools (v4 ETH, v3 WETH, USDG) actually take the 3% ETH fee? Next: read IndexFeeHook from verified source search or the v4 pool's hook field and eth_call the fee on each book"
    - text: "Which of the four Llama LEGACY_DISTRIBUTORS is the current StockDistributor, and do its Distributed events reproduce the site's $1,524,526.02? Next: open each distributor on Blockscout for verified name and sum Distributed amount"
    - text: "Can the owner change minShareBalance, the excluded set, or the hook fee without a timelock, and who holds 0x02d9e7…? Next: read IndexFeeHook owner/setters once the hook address is known"
    - text: "Is there an audit whose scope matches ReflectionToken, IndexFeeHook and StockDistributor? Next: ask in public and record any report URL as a claim"
    - text: "Does the site HTML or docs name the INDEX CA and @TheIndexFi so the official pair is bidirectional without DexScreener? Next: read bundled JS or a footer once the client hydrates"
    - text: "Is github.com/justintimecompilation or blobsarp/indices an official repository? Next: a site or X link to a repo, or leave NULL"
  unresolved:
    - text: "The project's claim of about $1M in Stock Tokens distributed (workbook: over $1M) has not been reproduced on chain."
    - text: product.mechanism remains unresolved (CON-1).
themes:
  - index
  - rwa
  - hook
risks:
  - Distributions scale with taxed volume. [verified S12] [claim S16]
  - If the 3% ETH fee sits only on the Uniswap v4 Index/ETH pool, flow on the lead Uniswap v3 INDEX/WETH book would not buy stocks. [verified S12] [claim S16]
  - The token owner is one EOA with no timelock on setMinShareBalance and setRewardsExcluded, so eligibility for the registry can change at that key. [verified S12]
