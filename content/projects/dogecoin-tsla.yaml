why_people_care:
  - DOGECOIN is a LONG-launched graduation that prices a memecoin in tokenized Tesla instead of ETH or USDG. [claim S14]
  - DexScreener printed about $1.37M of 24h volume on the DOGECOIN/TSLA book at collection, with about $79.2k liquidity. [claim S14]
  - Several other TSLA-quoted memecoins exist on the same chain, so ticker-only pairing is not identity. [claim S14]
risks:
  - USD liquidity on the DOGECOIN/TSLA book counts both sides, and aggregators disagree on the reserve (DexScreener $79.2k vs Gecko token/pools $99.1k). [claim S14]
  - A second DOGECOIN ticker at 0x8903… quotes TSLA with almost no liquidity. [claim S14]
  - DexScreener lists x.com/dogeteslacoin, which is suspended. [claim S14]
