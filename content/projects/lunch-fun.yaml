summary: A free one-click memecoin launchpad on Robinhood Chain. A user mints a 1 billion-supply ERC-20 in one transaction into a locked Uniswap V3 or V4 pool, quoted against ETH, USDG, a Robinhood stock token, or lunch's custom HOOD pair. Creators pick V3 1% fees or a V4 tax with holder rewards. Ticker Mog LLC runs it at lunch.fun as @lunchdotfun.
