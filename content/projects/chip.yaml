summary: A one-billion-supply ERC-20 launched on Pons v2 and graduated into a Uniswap v4 pool quoted against AMD. PonsV2LaunchAndBuy deploys Cyber Hardware-Integrated Pup (CHIP) in one launchAndBuy call, seeds a bonding curve, then sweeps into the CHIP/AMD book. Traders buy and sell CHIP on Uniswap v4. AMD is the quote rail, not this token. CHIPxAMD.com embeds this CA. No bidirectional official handle was located this pass.
