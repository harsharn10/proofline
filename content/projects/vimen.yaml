findings:
  positive:
    - text: The workbook lists MAG7 (AAPL/MSFT/GOOGL/AMZN/META/NVDA/TSLA) and AI6 (NVDA/AMD/MU/PLTR/GOOGL/SPCX) as fully backed baskets of Stock Tokens redeemable for the underlying.
      class: claim
      sources:
        - S6
    - text: DefiLlama listed Vimen under Indexes with about $9,208 TVL on 2026-08-31 per Proofline's chain map.
      class: claim
      sources:
        - S5
  risk:
    - text: The workbook notes HOOD6 is a basket of chain-native tokens (CASHCAT, ARROW, HOODRAT, VIBECAT, VEX, VIRTUAL), not Stock Tokens.
      class: claim
      sources:
        - S6
    - text: "Receipts: www.vimen.org, /vim, docs, GitHub README and SECURITY.md, @vimenprotocol posts, Blockscout addresses and txs, RPC, Llama protocol and adapter, and DexScreener VIM pairs were opened on 2026-09-03 and excerpts copied. [verified R-1 R-5 R-14 R-16] - Numbers: 9452.82 is the Robinhood Chain slice from api.llama.fi/protocol/vimen, not an all-chains total and not DexScreener $VIM marketCap 235686. MAG7 supply is 53.325670672318175e18, not 1e18. [claim R-14 R-16] [verified R-5] - Adversarial: the strongest contrary reading is that Vimen is PonsVault $VAULT or an ERC-4626 index vault. $VAULT is PonsLauncherToken from PonsVaultLauncher; MAG7 is BasketToken from EOA 0xB15e…b189; rIDX remains a different repository with no shared address."
      class: inference
      sources:
        - S13
        - S32
    - text: Issuer freeze on any constituent reverts whole-basket redeem. [claim R-25] - First-party Safe is threshold 1. [verified R-9] - No professional audit report was located; Llama audits 0. [unknown] - $VIM owner() 0xe220…2567 sits on the Virtuals AgentTokenV4 clone (tax/blacklist on that token per SECURITY.md), not on basket custody. [verified R-8] [claim R-25] - PonsVault $VAULT is a separate Pons fee-layer token.
      class: verified
      sources:
        - S32
  missing:
    - text: Deployed addresses and bytecode vs repository
    - text: Immutability / no-admin-key claim not reproduced
    - text: Basket caps and redemption path
    - text: An independent audit was not found in this review
    - text: Basket composition (MAG7, AI6, HOOD6 per the workbook) not reproduced
    - text: "Which BasketToken setters does guardian() actually expose on the verified MAG7 source (pause, cap, fee recipient), and does redeem stay callable while mint is paused? Next: read verified BasketToken source on Blockscout for MAG7 and call mintPaused/supplyCap"
    - text: "What is the live recipe on VVIRT/VMAG/VCT (constituents()/units()) after agent rebalances, versus the frozen MAG7/AI6/HOOD6 sets? Next: eth_call constituents() and units() on each agentic basket and map addresses to tickers"
    - text: "Where is the professional-audit artifact, if any, matching BasketToken / BasketToken2 on 4663? Next: open GitHub security advisories page and any auditor named in later posts"
    - text: "What is the VBILL / SGOV-SPY basket address the app lists as opening, and does it have code on 4663? Next: BasketFactory2.allBaskets() and app basket route"
    - text: "Is telegram or discord an official surface? Next: leave NULL unless a later official post names one"
