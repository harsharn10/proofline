  - First-party guardian is a 1-of-1 Safe. [claim S9]
  - $VIM is a Virtuals AgentTokenV4 with an owner key; it is the curator-license token, not basket custody. [claim S9]
tldr: In-kind index baskets of Robinhood Stock Tokens.
tldr_source: derived
why_people_care:
  - Robinhood Chain lists many Stock Tokens and no native ETF. [claim S9]
  - Vimen is the live in-kind basket that holds those tokens (and some chain-native names) in one ERC-20 a wallet can mint or redeem. [claim S9]
  - Curators burn $VIM once to publish more baskets through the same factories. [claim S9]
