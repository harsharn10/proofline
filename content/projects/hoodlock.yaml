summary: Native ERC-20 locker on Robinhood Chain. A user approves a token, pays a flat ETH fee, and verified RobinhoodLocker holds the balance until an unlock time that can only be extended. The same suite burns to the dead address and vests with a cliff. $LOCK is a Pons-launched token at hoodlock.tech / @HoodLockRH. Uniswap v3 and v4 LP NFTs are not lockable here.
