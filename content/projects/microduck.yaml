summary: A Pons v2 ERC-20 on Robinhood Chain. The launch minted a 1B-supply token onto a bonding curve quoted against tokenized NVDA, then graduated into a Uniswap v4 microduck/NVDA pool. Traders also use later microduck/USDG books. microduck.net and @MicroDuckNVDA publish the contract. The token is not Artificial Inu and is not the Pollen Robotics robot.
