findings:
  positive:
    - text: Proofline records pools.trade as a Uniswap Labs launchpad announced on the Uniswap blog on 2026-08-05, with active mint links on X.
      class: claim
      sources:
        - S2
        - S4
    - text: The workbook's Dune extract records about 71k tokens launched and 62k traded, 119 paired to a Stock Token.
      class: claim
      sources:
        - S3
    - text: "Receipts: Uniswap blog, @Uniswap announcement, pools.trade HTML, @TradePools and @pools_dot_fun profiles, Bitquery docs, Blockscout API v2 for four addresses plus the factory creation tx, Uniswap/liquidity-launcher README, DefiLlama Robinhood fees overview, Hookr FAQ, and the 2 Sep GeckoTerminal quote were opened on 2026-09-02; excerpts are copied from those pages. [verified R-1 R-2 R-3 R-4 R-5 R-6 R-8 R-9 R-10 R-11 R-12 R-13 R-14 R-15 R-16 R-17] - Numbers: the 48,955 USD figure is DefiLlama's Robinhood Chain fees slice for module pools-trade, not an all-chains total; Llama lists only Robinhood Chain on that row. Bytecode lengths are eth_getCode at block 52929547. [claim R-16] [verified R-6] - Adversarial: the strongest contrary reading is that this slug is the SushiSwap Pools.fun pad, or that it is Hookr's pool-first model. @pools_dot_fun's own bio names SushiSwap and pools.fun; pools.trade sets twitter:site @TradePools; Hookr's FAQ disclaims affiliation."
      class: claim
      sources:
        - S8
        - S19
        - S20
  risk:
    - text: Liquidity is described as permanently locked; a creator cannot withdraw the v4 position. [claim R-1 R-11] - Crowd Launch refunds depend on a threshold that Uniswap ($10k FDV) and Bitquery (~$5k raise) do not state the same way. [claim R-1 R-5] - Census handle @pools_dot_fun is a different product (Pools.fun / SushiSwap). [claim R-15] - Audit reports on the launcher repo are v1/v2; Robinhood v3.2.0 scope is unverified in this pass. [claim R-11] - Optional creator fees mean some tokens pay a creator on every trade.
      class: claim
      sources:
        - S6
        - S7
  missing:
    - text: Mainnet status rests on the project's own posts; not independently verified
    - text: Factory address not located
    - text: Launch fee flows
    - text: Whether Uniswap Labs retains control of the factory
    - text: Site URL not in the intake
    - text: Relation to the 'Poolsfun' Sushi-V3 launches unresolved
    - text: "Census handle @pools_dot_fun is Pools.fun (SushiSwap pad at pools.fun). Official pools.trade handle is @TradePools. Compiler should not merge the two products onto this slug. Next: controller decision on census handle and whether Pools.fun gets its own candidate slug"
    - text: "Do the v1.0 / v2.0.0 OpenZeppelin and Spearbit reports cover the Robinhood v3.2.0 InstantLaunchStrategy and LiquidityLauncher bytecode? Next: read each report's commit/version scope against commit dd8769cd45c0e9450e928513ee129b0af74f7f32"
    - text: "How does the blog's optional 0.05% creator fee of the 0.25% LP fee map onto the GitHub fees-on FeeSplitter (40% native ETH to UERC20BeneficiaryVault, 60% to compounding)? Next: read InstantLaunchStrategy and FeeSplitter verified source on Blockscout"
    - text: "Crowd Launch threshold: Uniswap blog ~$10k FDV or refund vs Bitquery ~$5k-equivalent raise. Which figure is the on-chain auction stop? Next: read a live CCA auction contract and the pools.trade cca.listAuctions payload"
    - text: "Bitquery Instant/curve UI shows $50k FDV graduation progress with no on-chain migration. Confirm it is display-only. Next: compare one token's Trading.Supply.MarketCap with the pools.trade curve.getLaunchByAddress graduation field"
    - text: "Who can change InstantLaunchStrategy, LiquidityLauncher, or FeeSplitter parameters after deploy? Next: eth_call owner()/authority on the four reproduced contracts and read verified source modifiers"
  unresolved:
    - text: Two X handles (@pools_dot_fun and @TradePools) are in use; Proofline kept both until the canonical one is confirmed. Whether the 'Poolsfun' Sushi-V3 launches noted by GeckoTerminal on 16 Aug are the same product is unresolved.
