summary: Uniswap Labs' own launchpad on Robinhood Chain. A user picks Crowd Launch — a four-hour TWAP that refunds below about $10k FDV — or Instant Launch, a bonding curve that is live immediately. Both mint 1 billion tokens and end in a locked Uniswap v4 pool with a 0.25% autocompounding LP fee. Uniswap Labs runs it at pools.trade as @TradePools.
