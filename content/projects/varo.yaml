summary: Varo is a Robinhood Chain token launchpad by Rialto. One transaction mints a fixed-supply ERC-20 into a locked Uniswap v3 1% pool quoted in WETH, USDG or a liquid Robinhood stock token, with no bonding curve and no graduation step. The pool fee is 1%; after 29 Jul 2026 new launches send 20% of that fee to the protocol and 80% to creators.
