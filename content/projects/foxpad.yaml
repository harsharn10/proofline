summary: Bonding-curve launchpad on Robinhood Chain. A user deploys a 1 billion-supply ERC-20, sells 750 million on a public curve, and at 4.75 ETH the raise plus 250 million reserved tokens open a locked 1% Uniswap v3 pool. Token-side pool fees burn; the ETH side pays the creator. The interface is foxpad.app. @FoxPad_RH posted the mainnet live date. Half of protocol fees are labeled FOX Revenue Vault.
