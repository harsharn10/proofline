summary: "A yield layer for tokenized stocks on Robinhood Chain: deposits go into Uniswap v4 strategy vaults or into permissionless Omnipools of up to eight tokens, and swap fees accrue to the position. Users deposit a stock token, USDG or ETH on earnonhood.com, receive vault or pool shares, and withdraw by burning those shares. @EARNONHOOD runs the app. $EARN is a Doppler-cloned ERC-20; the lead book is EARN/SPY."
