findings:
  positive:
    - text: "The official account posted on 2026-08-30 that zaps were live for its omnipools: deposit ETH or USDG and have it split across up to eight assets, routed through Rialto."
      class: claim
      sources:
        - S5
        - S4
    - text: The workbook records Uniswap v4 strategy vaults on NVDA/USDG and GME/USDG and a protocol take of 10% of omnipool swap fees with 90% to LPs.
      class: claim
      sources:
        - S3
  risk:
    - text: owner() on the EARN token contract returns 0xeb7c…0862, the verified Airlock contract that also owns the EARN, Statics and Artificial Inu tokens; the token's owner-only functions are controlled by shared launch infrastructure, not by a project-held key or multisig.
      class: verified
      sources:
        - S6
    - text: The name collides with Robinhood Earn, the Morpho-based USDG lending product inside the Robinhood app, which has no token; the two are unrelated per the workbook.
      class: claim
      sources:
        - S3
    - text: "Receipts: earnonhood.com, /docs, /stake, /lend, /steer, /omni/create, X profile and seven posts, @0xDeployer, DexScreener, Blockscout token/tx/factory/Airlock/Safe/vaults/zaps/stake/Morpho/Steer/Omnipool, Morpho curator, RPC, and Llama protocols list were opened on 2026-09-02 and excerpts copied from the responses. [verified R-2 R-4 R-5 R-12 R-21] - Numbers: DexScreener liquidity and 24h volume are the Uniswap EARN/SPY book 0x1fb9a450…, not all EARN pairs and not vault TVL. Holders 2030 is all token holders. Morpho 144.040224 USDG is totalAssets on 0x8046…771d. Official $200k remains class claim. [claim R-4 R-6 R-18 R-22] - Adversarial: the strongest contrary reading is that this is Robinhood Earn, the in-app Morpho USDG product. That product has no EARN token and does not use earnonhood.com; this token, NVDA vault and Omnipool are separate 4663 contracts. A weaker contrary reading is that EARN is only a Doppler memecoin: the token is a Doppler/Airlock clone, but NvdaUsdgV4VaultV6 verified source and Morpho VaultV2 exist with code."
      class: inference
      sources:
        - S9
        - S11
        - S18
        - S23
    - text: Vault, stake and Morpho owner is one EOA; no timelock was opened. [verified R-12 R-21] - GME vault, stake and Omnipool source are unverified; the stake page still says verified. [verified R-14 R-16] [claim R-31] - Posted TVL, Morpho 144 USDG and the EARN/SPY book are different slices. [claim R-4 R-22] [verified R-18] - Name collision with Robinhood Earn (in-app Morpho USDG, no token). [claim R-3] - No audit report was located. [unknown] - Permissionless Omnipools can include unaudited ERC-20s; the create page says a listing is not an endorsement.
      class: claim
      sources:
        - S40
  missing:
    - text: Mainnet status rests on the project's own posts; not independently verified
    - text: Token address from the bio and workbook not reproduced on Blockscout
    - text: Vault and omnipool addresses unknown
    - text: Strategy control and rebalancing powers
    - text: Protocol fee take (10% of omnipool swap fees per the workbook) not verified against contracts
    - text: An independent audit was not found in this review
    - text: "Can EOA 0x75741d… rebalance, pause or move NVDA/GME vault inventory without a timelock, and do the unverified GME vault and stake match the docs 85/15 fee and withdrawal path? Next: read setter access in NvdaUsdgV4VaultV6 and verify GME/stake source"
    - text: "Which onchain balances sum to the posted $200k TVL (Omnipools vs Steer vaults vs strategy vaults vs Morpho 144 USDG)? Next: eth_call share supply and underlying on each listed vault and Omnipool"
    - text: "Is there an audit whose scope matches NvdaUsdgV4VaultV6, the zaps, Omnipool AMM and Morpho curator config? Next: record any report URL as a claim when published"
    - text: "Who holds the six Airlock Safe keys, and does that Safe retain token-owner rights (mint, blacklist, upgrade) on DopplerERC20V1? Next: read DopplerERC20V1 owner-only functions against Airlock"
    - text: "Do telegram, discord or a public repository exist? Next: leave NULL unless a primary page names one"
    - text: "Are the three 2026-09-02 themed Omnipools (AI Index, US Bluechip, Aero + Defense) published as contract addresses? Next: open /omni/pools once the app returns a pool list without a wallet"
