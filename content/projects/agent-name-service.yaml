  positive:
    - text: The official account posts a .agent namespace on Robinhood Chain with names priced at 0.002 ETH per year (accounts intake, 2026-08-31).
      class: claim
      sources:
        - S3
        - S2
  risk:
    - text: "Receipts: agentsn.xyz, /docs, /register, X profile and named status URLs, Blockscout address/token/tx/search APIs, DexScreener latest/dex/tokens, DefiLlama protocols, github.com/RHAgentNS (404), and RPC eth_getCode/eth_call were opened on 2026-09-03; excerpts are copied from those responses. [verified R-1 R-4 R-6 R-8] - Numbers: 5066.36 USD is DexScreener Uniswap v4 ANS/ETH liquidity.usd, not protocol TVL; 1.2 USD is that pair's volume.h24; 64 is Blockscout holders_count; 47823576.32 ANS is the lock amount, not circulating supply. [claim R-5 R-8 R-9] - Adversarial: the strongest contrary reading is that Agent Name Service is Hoodle NS, RHNS, .hood or Bankr, or that census `announced` still holds because the registrar is unverified. Distinct handle, domain and four docs-named contracts with non-empty code, plus a verified Pons v2 token whose socials() match the site, argue against a merge and meet the mainnet bar."
      class: inference
      sources:
        - S5
        - S6
        - S9
        - S11
    - text: "Four registry contracts are unverified; owner, fee recipient and revoke path were not read. [claim R-11 R-12] [unknown] - Token deployer and registry deployer are different EOAs with no code. [verified R-6 R-15] - Registration price and buyback share are project posts and site JS, not a reproduced fee-sink balance. [claim R-1 R-18] - Other ERC-20s on chain 4663 use AgentNS / Agent Name Service / RHAgentNS names. Flag: ca-collision. [claim R-24] - No audit report URL was located."
      class: unknown
  missing:
    - text: Lifecycle not verified — no deployment evidence reviewed
    - text: Registrar contract not located
    - text: Fee custody and revocation powers
    - text: Official site not located
    - text: "Who is owner/governance on AgentNames, AgentIdentity, AgentResolver and AgentMarket, and can they reassign or revoke a live name? Next: eth_call owner/governance views once source is verified or ABI is published"
    - text: "Which 4663 address receives registration ETH and runs the $ANS buyback named on the homepage? Next: read fee-recipient views on AgentNames and trace a register tx"
    - text: "Are the token deployer 0x4B4B…Ed69 and the registry deployer 0x35A9…6155 the same operator, and is there a timelock? Next: trace funding and admin calls on both EOAs"
    - text: "Is there an audit of the four registry contracts? Next: open any report URL the project posts and match commit/address scope"
    - text: "What are live identity, name and pricePerYear figures on chain? Next: eth_call the stats views the site uses"
    - text: "Do the other AgentNS-named ERC-20s share a deployer with 0xdB9B…0C24? Next: read creator_address_hash on 0xdD767…, 0xE642… and 0x89d3…"
