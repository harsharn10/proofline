summary: The chain's isolated money market for tokenized stocks. Lenders deposit USDG into an ERC-4626 vault that allocates behind per-market caps; borrowers post NVDA, AAPL, SPY or other listed tokens and draw USDG without selling. Equity books use Chainlink prices; PONS uses a Uniswap TWAP and a separate vault. @DenarMarkets runs denar.markets.
