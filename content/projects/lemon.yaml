summary: "A Uniswap V3 Instant launchpad on Robinhood Chain. A creator sends one transaction through LemonLaunchFactory: the factory deploys a 1-billion fixed-supply ERC-20, seeds a TOKEN/WETH 1% full-range pool, and locks the LP NFT in LemonLaunchLocker. Fees split 30/70 platform/creator. Users launch and trade at lemon.fun, operated as @lemondotfun. Optional stock-dividend vaults and per-coin X agents are claimed on the same site."
