findings:
  positive:
    - text: The official account posted on 2026-08-22 that each coin gets its own X account posting from on-chain facts (market cap, volume, holder concentration, locked LP), that coins from other pads can be connected, and that Hyperliquid leverage is available through a Lemon terminal; Proofline places it as a launch/trade pad distinct from Pons, Hookr, LONG and pools.trade.
      class: claim
      sources:
        - S3
        - S2
  risk:
    - text: "Receipts: lemon.fun, /docs, /launch, /leverage/BTC, the public token and stats APIs, @lemondotfun profile and six posts, DexScreener pairs, Blockscout factory/locker/token/pool/fee-receiver/create txs, and RPC were opened on 2026-09-03 and excerpts copied from the responses. [verified R-1 R-11 R-15] - Numbers: 124714 and 735282 are the DexScreener LEMON/WETH chain pair, not an all-chains launchpad total. Holders 12457 is the Blockscout token counter. Homepage 682 / $134.4K and stats API 56 / 674 are not mixed into one figure. [claim R-13 R-18 R-20] - Adversarial: the strongest contrary reading is that Lemon is only a frontend over Uniswap V3 and Hyperliquid, with no native factory. Verified name LemonLaunchFactory, TokenLaunched logs, and the 2026-07-25 launchToken tx that created 0xf0E1…f7A3 argue the Instant V3 path is native. A second contrary reading is that 0xef07…4Ba3 is the official coin; creator DopplerERC20V1Factory and two holders argue against it."
      class: inference
      sources:
        - S15
        - S17
        - S21
        - S25
    - text: Factory and locker `owner()` is one EOA, against docs "unowned". [verified R-15] [claim R-1] - Stock-dividend vault factory address was not located. [claim R-1] - Hyperliquid perps are a frontend claim; custody was not reproduced on Hyperliquid. [claim R-10] - No audit report was located this pass. [unknown] - Homepage vs stats API launch counts disagree.
      class: claim
      sources:
        - S6
        - S24
  missing:
    - text: Mainnet status rests on the project's own posts; not independently verified
    - text: Contract addresses not located
    - text: Launch custody and fee flows
    - text: Key custody for the Hyperliquid leg
    - text: Official site not located
    - text: An independent audit was not found in this review
    - text: "What can owner 0xEF2c…0aB6 change on LemonLaunchFactory and LemonLaunchLocker (fee recipient, claim path, pause) and is there a timelock? Next: read verified LemonLaunchFactory and LemonLaunchLocker source on Blockscout; eth_call feeRecipient/paused if present"
    - text: "Docs §2.1 say a fresh locker per launch and TokenLaunched(token, pool, locker, creator, tokenId); decoded factory logs are TokenLaunched(token, deployer, dexFactory, pairToken, pool, dexId, launchConfigId, positionId, …) with a single shared locker 0xC103…6903. Which ABI is live? Next: read verified factory event definitions and one launchToken internal trace"
    - text: "Where is the StockDividendVault factory address, and has any Instant V3 launch on 4663 actually nominated a stock token? Next: search Blockscout for StockDividendVault created by 0xEF2c…0aB6; sample lemon.fun API tokens with stockSymbol set"
    - text: "Does the Hyperliquid BTC-perp UI at /leverage/BTC sign and settle, or is the book still POLLING with no live position? Next: connect a read-only flow or match a Hyperliquid account to a lemon.fun session; do not treat custody as verified from the meta line alone"
