summary: A one-billion-supply ERC-20 launched on a Pons v2 bonding curve and graduated into a Uniswap v4 pool quoted against SNDK. PonsV2LaunchAndBuy deploys Sandisk Optimus (OP) in one launchAndBuy call, seeds the curve against SNDK, then a later createGraduatedPool locks the OP/SNDK book. Traders buy and sell OP on Uniswap v4. SNDK is a Robinhood Stock Token rail. Distinct from packed CACHE/SNDK and from HDD/SNDK. No official site or handle was located this pass.
