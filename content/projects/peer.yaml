summary: Binary options on a fomo trader's total account PnL. A user buys a USDG call or put on whether that PnL is higher at close than at open, over 24 hours or 7 days. Settlement is the median of three published leaderboard snapshots. Collateral sits in PeerMarketV1 on chain 4663. $PEER is a Pons v2 token and is not the settlement asset.
