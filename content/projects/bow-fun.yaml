summary: "bow.fun is a token launchpad on Robinhood Chain. A launch deploys a fixed-supply ERC-20 into a locked Uniswap pool from the creator's wallet: Standard is Uniswap V3 against WETH, IPO is Uniswap V4 with vesting and a whitelist, RWA is Uniswap V4 paired with a stock token. LP is locked by contract. Creators claim trade fees. Token addresses are mined to end in b03. The live launch entry in config.js is FactoryHub 0x229Faa91…7E29; a legacy V3 factory 0xC70E510E…ab79 remains deployed. The handle is @bowdotfun; the site is bow.fun."
