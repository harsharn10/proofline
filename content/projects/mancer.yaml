review:
  researcher: harsharn10
  approver: pending
  methodology_version: proofline-v1.0
  reviewed_at: 2026-08-31
  published_at: null
findings:
  positive:
    - text: Mancer says swaps enforce a user-accepted minimum output onchain and revert below it, and that tokens behind a signed order stay in the user's wallet until the fill executes.
      class: claim
      sources:
        - S2
    - text: Mancer documents three order-exit paths — a free signed cancellation honored by its executor, an onchain cancellation, and revoking the token allowance.
      class: claim
      sources:
        - S2
    - text: The project posted on 2026-08-14 that its aggregator and order layer was live in beta for Chain Mancers and StonkBrokers holders, and on 2026-08-25 that a formal audit of the router and order contracts was under way with public access to follow.
      class: claim
      sources:
        - S7
        - S5
    - text: The workbook records each Chain Mancer NFT as backed by 500k MANCER, with 1,250 NFTs reserved to back an Anvil LP.
      class: claim
      sources:
        - S6
  risk:
    - text: The free cancellation path depends on Mancer's executor honoring a signed cancellation; a chain-enforced exit requires an onchain cancellation or an allowance revocation.
      class: inference
      sources:
        - S2
    - text: Users approve a single Mancer contract that the docs say forwards trades only to an allowlisted set of venue contracts; the reviewed page does not say who controls that allowlist or whether changes are delayed.
      class: inference
      sources:
        - S2
    - text: No public-open post was found through 2026-08-31; the census lifecycle was moved from mainnet to beta on Proofline's reading of the project's own posts.
      class: claim
      sources:
        - S8
        - S5
    - text: "Receipts: site, docs, whitepaper, status, Blockscout, RPC, DexScreener, Sherlock report URL, and the cited X posts were opened on 2026-09-02. [verified R-1 R-8 R-9 R-16] - Numbers: DexScreener figures are aggregator prints for MANCER pairs, not explorer pool inventory. [claim R-11] - Adversarial: the strongest contrary reading is that Mancer is only a Clutch memecoin with a docs site. The verified Router/Orders, 1,343 router txs, public-open post, and swap widget CA argue the aggregator is a separate live product that happens to share a deployer with the token."
      class: inference
      sources:
        - S17
        - S24
    - text: Signed cancel is executor-honored; chain exits are on-chain cancel or allowance revoke. [claim R-2] - Venue allowlist owner and the live AllowanceTarget were not reproduced. [unknown] - Live Router was deployed 20 Aug; Sherlock audit window is 24–27 Aug — bytecode match to the final commit is open. [claim R-13] [verified R-9] - $MANCER is a Clutch CollectionToken, not a MancerRouter receipt; presenting Clutch NFT backing as aggregator TVL would mix products. [verified R-6] - Mancer Shield is an announcement, not a deployment this pass.
      class: claim
      sources:
        - S26
  missing:
    - text: Router, settlement, executor and token addresses not yet located; the $MANCER token address comes from the workbook and is not reproduced
    - text: Non-custodial and minimum-output claims not yet reproduced against deployed contracts
    - text: Venue allowlist ownership and change controls not documented in the reviewed page
    - text: Audit announced 2026-08-25 — no report, scope or covered deployment found in this review
    - text: Executor availability, key management and monitoring not independently verified
    - text: NFT fee-claim mechanics unverified
    - text: "Shield: announced only — no deployment evidence reviewed"
    - text: "Which MancerAllowanceTarget is the live Router isolated-approval target, and who can change the venue allowlist? Next: read MancerRouter verified source for allowanceTarget() / allowlist owner and match a live approval"
    - text: "Does AMMFactoryV2 0x432D20AA… still exist on 4663? Next: RPC eth_getCode on 0x432D20AAe5605b1E94C114283d7155eBc6727351"
    - text: "Can the Sherlock report commit 3a5374b4… be matched to the live Router/Orders bytecode? Next: compare runtime code hash of 0xFBA80Ff9… to the final commit artifacts"
    - text: "Where is the Chain Mancers NFT contract, and does it actually receive aggregator fees? Next: Blockscout search ChainMancer / Collection NFT and fee-forward on MancerRouter"
    - text: "Is Mancer Shield deployed anywhere on 4663? Next: search Shield / MancerShield on Blockscout after a contract announcement"
  unresolved:
    - text: Whether the audit announced on 2026-08-25 has been published; no report was found in this review.
