risks:
  - Hook owner() is a single EOA (whatthehook.eth) while the docs name a 4-of-6 Safe as admin; those two control pictures are not reconciled in this pass. [claim S6]
  - Hook and executor source are unverified. [claim S6]
  - Llama still reports protocol revenue as zero after the 2 Sep treasury-split post. [claim S6]
tldr: A Uniswap v4 hook that recaptures cross-pool arbitrage and pays it to swappers and LPs.
tldr_source: derived
why_people_care:
  - This is the chain's MEV-redistribution hook, not a launchpad. [claim S6]
  - Any v4 pool that attaches 0xc52f…54c0 at creation sits in the same capture path as WTH's own WETH pools, including hooked NVDA/USDG and other Stock Token quotes named in the docs. [claim S6]
  - Hookr composes launch rules; this hook closes price gaps. [claim S6]
