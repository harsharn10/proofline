findings:
  positive:
    - text: Proofline records the product as an MEV bot that runs inside a Uniswap v4 hook and redistributes captured value to traders and LPs, with a DefiLlama TVL row of about $1.93M on 2026-08-31.
      class: claim
      sources:
        - S3
        - S4
  risk:
    - text: "Receipts: site, docs, dashboard, X profile and status URLs, Llama protocol/fees APIs, DexScreener token API, Blockscout address/tx/source APIs, and RPC eth_getCode/eth_call were opened on 2026-09-03; excerpts are copied from those responses. [verified R-1 R-2 R-3 R-6 R-9 R-10 R-16] - Numbers: TVL 210671.39 is currentChainTvls['Robinhood Chain'], not staking 1174598 and not an all-chains total; 24h volume 215448.4 is one WTH/WETH v4 pair; fees 1790 is the 2026-09-02 Llama bar. [verified R-6 R-7 R-9] - Adversarial: the strongest contrary reading is that this is Hookr or HookOS. Handles, domains, and reproduced token/hook addresses differ; Hookr is a hook marketplace and $HOOKR's listed pool is hookless."
      class: inference
      sources:
        - S7
        - S8
        - S15
    - text: Hook `owner()` is one EOA while docs name a 4-of-6 Safe as admin; pause and pool-approval rights were not read from unverified hook source. [disputed R-2 R-16] - Hook and ArbExecutor bytecode are unverified. [verified R-11 R-12] - No audit report was located. [unknown] - Llama still books protocol revenue as zero after the posted treasury split. [disputed R-4 R-8] - Capture needs active in-range liquidity and approved routes; docs state no payout when no realised profit.
      class: claim
      sources:
        - S7
  missing:
    - text: Hook and token addresses not located
    - text: Upgrade and redirect powers over the hook
    - text: How MEV is captured and paid out
    - text: An independent audit was not found in this review
    - text: Official site not located
    - text: "Does the 4-of-6 Safe actually own pause / pool-approval on the hook, or is hook owner() the EOA whatthehook.eth the live admin? Next: verify hook source or eth_call any owner/admin/paused views once ABI is known"
    - text: "Is there an audit whose scope matches hook 0xc52f…, executor 0x26a5…, and factory 0x7F66…? Next: ask in public and search named-auditor indexes if a firm is ever posted"
    - text: "After the 2026-09-02 split change, do ProfitCurrencyDistribute / ProtocolRevenue logs still match Llama's zero-revenue methodology? Next: read a post-2-Sep distribution tx and the fees adapter at dimension-adapters/fees/what-the-hook.ts"
    - text: "Hook and ArbExecutor source remain unverified; what are the pause, upgrade, and route-approval selectors? Next: submit source or decompile; read factory deployHook verified bytecode if the factory is verified later"
    - text: "Public Telegram URL named in the 2 Sep post was not located Next: record the t.me if a later official post or bio lists it"
    - text: "HookOS (@hookosfun, $HOOK 0x85d4e6F147BFb5729378E451F32cf5287dE75f97) is a separate multi-chain hook pad and is not a census slug, so it cannot be filed under possible_matches Next: keep HookOS off this row; seed it only if a confirmed Robinhood official surface appears"
