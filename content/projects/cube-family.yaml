summary: "Cube Family is a token launchpad on Robinhood Chain. A launch is one `deployCoin` transaction: TokenDeployer CREATE2-deploys an ERC-20 and Factory opens a Uniswap v4 pool with CubeHook. There is no bonding curve and no graduation. Swap fees split 80/20 on-chain (CREATOR_SHARE_BPS 8000) to holders or the creator, with the 20% platform share pushed to CubeFeeVault. The handle is @CubeFamilyX; the named site is cube.family."
