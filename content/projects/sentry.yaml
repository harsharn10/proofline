slug: sentry
name: Sentry
symbol: SENTRY
category: Uniswap-pool launchpad
lifecycle: mainnet
coverage: stub
summary: Sentry is a token launchpad and swap app on Robinhood Chain and Ink. A launch deploys a fixed-supply ERC-20 into a Uniswap pool in one transaction; there is no bonding curve and no graduation. New launches use Uniswap v4 with the position locked in SentryLPVault. A legacy V3 factory remains on each chain. The app also quotes Uni V3/V2/v4 and PancakeSwap V3 on Robinhood, and Uni V3 on Ink. The handle is @sentrylauncher; the site is sentry.trading.
