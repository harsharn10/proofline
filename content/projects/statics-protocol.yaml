summary: Statics Protocol's live Genesis layer is a fixed-supply STATICS token created through Doppler Airlock into a Uniswap v4 STATICS/WETH multicurve, plus a 5,555 Operator NFT collection the docs back at 180,000 STATICS each. A user buys STATICS on that book or acquires an Operator from the vault. EqualFi Labs publishes the contracts; the basket, Dollar, hook DEX and credit suite remain a separate unreleased rollout.
