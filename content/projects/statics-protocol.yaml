review:
  researcher: harsharn10
  approver: pending
  methodology_version: proofline-v1.0
  reviewed_at: 2026-08-31
  published_at: null
findings:
  positive:
    - text: Statics says its Genesis token and 5,555-token Operator collection are live on Robinhood mainnet.
      class: claim
      sources:
        - S1
    - text: EqualFi Labs publishes the Statics contracts, tests, SDK, deployment tooling and design documentation in a public repository under a BUSL-1.1 license.
      class: claim
      sources:
        - S9
    - text: The workbook records a fixed 1B supply with 800M sold across six Doppler curves at launch and 5,555 Operator NFTs each backed by 180k STATICS plus a compounding ETH reserve.
      class: claim
      sources:
        - S7
    - text: The official account posted on 30–31 Aug a design where STATICS stakers pick any 12 assets and earn from every pool trading them, Operators can borrow up to 95% against their backing, and a USDstx options-based stable is planned.
      class: claim
      sources:
        - S8
  risk:
    - text: owner() on the Statics token contract returns 0xeb7c…0862, the verified Airlock contract that also owns the EARN, Statics and Artificial Inu tokens; the token's owner-only functions are controlled by shared launch infrastructure, not by a project-held key or multisig.
      class: verified
      sources:
        - S11
    - text: The official security model says the broader multi-asset and Statics Dollar diamonds remain subject to independent review before production use, and that the repository test suite is not an external audit.
      class: claim
      sources:
        - S10
    - text: Both diamonds remain upgradeable through a shared timelock until a future reviewed cut removes Diamond-cut authority.
      class: claim
      sources:
        - S2
        - S10
    - text: Permissionless basket constituents can exhibit rebases, blocklists, arbitrary burns or hostile callbacks that the protocol does not make safe.
      class: claim
      sources:
        - S10
    - text: Per the project's own posts the hooks DEX is not live, credit is not enabled and the Genesis epoch is in progress; the census lifecycle was moved from mainnet to beta on that reading.
      class: claim
      sources:
        - S8
        - S6
    - text: "Receipts: site, rollout, tokenomics, operators, timelock, testnet page, GitHub README, SECURITY.md, genesis JSON, Blockscout, RPC, DexScreener, Gecko and the cited X posts were opened on 2026-09-02 and excerpts copied from those pages. [verified R-1 R-2 R-8 R-12 R-14] - Numbers: DexScreener and Gecko figures are aggregator chain-slice prints for the STATICS/WETH pool, not an explorer reproduction of PoolManager inventory. [verified R-12 R-13] - Adversarial: the strongest contrary reading is that Statics is another LONG/Doppler memecoin with docs for an unreleased basket protocol. Airlock.create, the verified Genesis vault/Operators, the mainnet genesis JSON, and empty testnet Diamond code on 4663 keep Genesis live and the Diamond suite separate. Shared Airlock with $AI is recorded as a possible match, not a merge."
      class: inference
      sources:
        - S20
        - S25
        - S19
    - text: Token owner-only functions sit on shared Doppler Airlock, which also owns other RH tokens including $AI. [verified R-8] - Genesis JSON still records governance ownership as unaccepted. [claim R-14] - STATICS/WETH liquidity is not one number across aggregators, and Gecko's reserve print is negative. [verified R-12 R-13] - Hook DEX and credit were still described as not live on 30 Aug; presenting baskets, USDstx or 95% LTV credit as live would overstate the rollout. [claim R-2 R-20] - No independent audit report was located.
      class: unknown
  missing:
    - text: Mainnet Genesis contract addresses in an official deployment manifest (the docs' manifest is testnet-only, chain 46630); the STATICS token address comes from the workbook and is not reproduced
    - text: Deployed mainnet governance, signer threshold and timelock configuration versus the documented seven-day default
    - text: Independent audit report, scope, covered commit and remediation status — an independent audit was not found in this review
    - text: Onchain confirmation that the public repository matches the deployed Genesis contracts; upgrade authority as deployed
    - text: USDstx is a design, not a deployment
    - text: "Are StaticsDiamond, StaticsDollarCoreDiamond, USDstx or the swap-fee hook deployed on chain 4663? Next: search Blockscout for StaticsDiamond / USDstx verified names on 4663 and read any mainnet diamond manifest if published"
    - text: "Has governance Safe 0x603A8A2f…b9Ff accepted ownership of the Genesis contracts? Next: owner() on vault, operators NFT, feeReceiver, launchDistributor versus the Safe"
    - text: "Why is DexScreener STATICS/WETH liquidity $14.25M while Gecko prints reserve_in_usd negative for the same pool id? Next: read Uniswap v4 PoolManager / Doppler initializer inventory for 0xe79228…e8a rather than aggregators"
    - text: "Is there an independent audit whose scope includes Genesis vault, Operators, or the Doppler modules used at launch? Next: auditor report index for EqualFi Labs / Doppler and a matching commit"
    - text: "Is credit or the hook DEX enabled on the live Genesis contracts, or still epoch-gated? Next: read StaticsGenesisVault credit functions and a recent Operator acquire/redeem tx"
    - text: "How many Operators are circulating versus vault inventory? Next: balanceOf(vault) and ownerOf sample IDs on StaticsGenesis"
    - text: "tvl is not published as a figure: the packet reported -3408657.19"
  unresolved:
    - text: The workbook warns to separate Genesis mainnet addresses from leftover testnet (chain 46630) addresses in the docs.
    - text: economics.metric remains unresolved (CON-1).
    - text: product.mechanism remains unresolved (CON-2).
