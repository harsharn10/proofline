review:
  researcher: harsharn10
  approver: pending
  methodology_version: proofline-v1.0
  reviewed_at: 2026-08-31
  published_at: null
findings:
  positive:
    - text: Statics says its Genesis token and 5,555-token Operator collection are live on Robinhood mainnet.
      class: claim
      sources:
        - S1
    - text: EqualFi Labs publishes the Statics contracts, tests, SDK, deployment tooling and design documentation in a public repository under a BUSL-1.1 license.
      class: claim
      sources:
        - S9
    - text: The workbook records a fixed 1B supply with 800M sold across six Doppler curves at launch and 5,555 Operator NFTs each backed by 180k STATICS plus a compounding ETH reserve.
      class: claim
      sources:
        - S7
    - text: The official account posted on 30–31 Aug a design where STATICS stakers pick any 12 assets and earn from every pool trading them, Operators can borrow up to 95% against their backing, and a USDstx options-based stable is planned.
      class: claim
      sources:
        - S8
  risk:
    - text: The official security model says the broader multi-asset and Statics Dollar diamonds remain subject to independent review before production use, and that the repository test suite is not an external audit.
      class: claim
      sources:
        - S10
    - text: Both diamonds remain upgradeable through a shared timelock until a future reviewed cut removes Diamond-cut authority.
      class: claim
      sources:
        - S2
        - S10
    - text: Permissionless basket constituents can exhibit rebases, blocklists, arbitrary burns or hostile callbacks that the protocol does not make safe.
      class: claim
      sources:
        - S10
    - text: Per the project's own posts the hooks DEX is not live, credit is not enabled and the Genesis epoch is in progress; the census lifecycle was moved from mainnet to beta on that reading.
      class: claim
      sources:
        - S8
        - S6
  missing:
    - text: Mainnet Genesis contract addresses in an official deployment manifest (the docs' manifest is testnet-only, chain 46630); the STATICS token address comes from the workbook and is not reproduced
    - text: Deployed mainnet governance, signer threshold and timelock configuration versus the documented seven-day default
    - text: Independent audit report, scope, covered commit and remediation status — an independent audit was not found in this review
    - text: Onchain confirmation that the public repository matches the deployed Genesis contracts; upgrade authority as deployed
    - text: USDstx is a design, not a deployment
  unresolved:
    - text: The workbook warns to separate Genesis mainnet addresses from leftover testnet (chain 46630) addresses in the docs.
