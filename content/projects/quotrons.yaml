findings:
  positive:
    - text: Project docs, as summarised by Proofline, describe 4,444 ERC-404 terminals where burning the liquid token permanently hardwires an NFT that can claim Stock Token rewards, with one QUOTRON/WETH Uniswap v4 pool and ten reward conversion routes (NVDA, AAPL, TSLA, GME, SPCX, SPY, PLTR, NFLX, RDDT, MSTR).
      class: claim
      sources:
        - S5
        - S4
    - text: The workbook records a 3% fee on WETH-side volume split into 2% stock rewards, 0.6375% locked LP, 0.2125% STONKBROKER buy-and-burn and 0.15% creator.
      class: claim
      sources:
        - S4
    - text: The project disclosed that V1 was retired after a stale-approval exploit on its ERC-721 mirror and that V2 is a new collection with a recovery Safe and a blacklist guardian.
      class: claim
      sources:
        - S5
    - text: "Receipts: llms.txt, llms-full.txt, integration.md, manifest.json, X profile and four posts, Pond Street, OpenSea V2 / overview / lowercase mint, GitHub brand kit, Blockscout token/tx/router/hook/mirror/reflections/converter/Safe/V1, DexScreener token API, and RPC calls were opened on 2026-09-03 and excerpts copied from the responses."
      class: verified
      sources:
        - S9
        - S10
        - S14
        - S20
        - S21
    - text: "Numbers: DexScreener volume and marketCap are Uniswap v4 QUOTRON/WETH 0x0b142aaf…, not all QUOTRON pairs. Holders 3649 is the ERC-20 token. Hardwired 2792 and liquid 1652 are RPC views that satisfy the 4,444 invariant. Site dashboard census figures were not copied from the SPA shell. [claim R-7 R-13]"
      class: verified
      sources:
        - S20
  risk:
    - text: "owner() on the QUOTRONS token and the QuotronWethHook returns 0x7171…7866, which the explorer marks as an EIP-7702 delegated account: one externally owned key delegating to smart-account code, not a multisig, with no timelock in the ownership chain."
      class: verified
      sources:
        - S8
    - text: The project discloses a recovery Safe and a blacklist guardian role for V2; who holds those keys and what they can do to user terminals is not documented in the intake.
      class: claim
      sources:
        - S5
    - text: Proofline flagged @QUOTRONGenesis as a mint account not treated as official, and treats @QuotronsDesktop (mint 2026-09-01) as a related drop until the same control plane is confirmed.
      class: claim
      sources:
        - S6
    - text: "Adversarial: the strongest contrary reading is that Quotrons is the Ink xStocks venue, or Sentry, or StonkBrokers, because @cruelhandeth ships at Ink, posted Sentry as a QUOTRON venue, and V2 fees buy STONKBROKER. The 4663 collection, router and Uniswap v4 pool id are distinct from Sentry and from StonkBrokers 0x539c…; Pond Street itself splits the Ink venue from the Robinhood collection. A weaker contrary reading is that V2 still trades ten stock pools: OpenSea overview says that, DexScreener and the manifest show one WETH pool."
      class: inference
      sources:
        - S21
        - S26
        - S27
        - S30
    - text: Owner, blacklist guardian and Safe signer 1 are the same EIP-7702 key; recovery can move user terminals.
      class: verified
      sources:
        - S20
        - S31
    - text: OpenSea overview still describes ten QUOTRON/stock pools (V1).
      class: claim
      sources:
        - S30
    - text: Ink xStocks venue and Sentry swap are related surfaces, not this collection's 4663 contracts.
      class: claim
      sources:
        - S26
        - S27
    - text: No audit report was located.
      class: unknown
    - text: Lowercase OpenSea slug quotrons404 is a different 10,000-item mint.
      class: claim
