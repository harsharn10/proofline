findings:
  positive:
    - text: Project docs, as summarised by the desk, describe 4,444 ERC-404 terminals where burning the liquid token permanently hardwires an NFT that can claim Stock Token rewards, with one QUOTRON/WETH Uniswap v4 pool and ten reward conversion routes (NVDA, AAPL, TSLA, GME, SPCX, SPY, PLTR, NFLX, RDDT, MSTR).
      class: claim
      sources:
        - S5
        - S4
    - text: The workbook records a 3% fee on WETH-side volume split into 2% stock rewards, 0.6375% locked LP, 0.2125% STONKBROKER buy-and-burn and 0.15% creator.
      class: claim
      sources:
        - S4
    - text: The project disclosed that V1 was retired after a stale-approval exploit on its ERC-721 mirror and that V2 is a new collection with a recovery Safe and a blacklist guardian.
      class: claim
      sources:
        - S5
  risk:
    - text: The project discloses a recovery Safe and a blacklist guardian role for V2; who holds those keys and what they can do to user terminals is not documented in the intake.
      class: claim
      sources:
        - S5
    - text: The desk flagged @QUOTRONGenesis as a mint account not treated as official, and treats @QuotronsDesktop (mint 2026-09-01) as a related drop until the same control plane is confirmed.
      class: claim
      sources:
        - S6
  missing:
    - text: Mainnet status rests on the project's own posts; not independently verified
    - text: Token, router and hook addresses from project docs not reproduced on Blockscout
    - text: Signers of the recovery Safe and scope of the blacklist guardian
    - text: Reward epoch status on Robinhood Chain
    - text: V1 exploit postmortem not reviewed
    - text: Whether the Desktop drop shares the same control plane
  unresolved:
    - text: A 25 Aug CT post claimed the same developer as RobinWifHat and a coming pad with a fee split; the desk did not verify it. A secondary source noted the reward venue on Ink had not run an epoch as of 2026-08-29; whether Robinhood Chain V2 epochs run independently is unchecked.
