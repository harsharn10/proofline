slug: alandale
name: Alandale
symbol: LUTE
category: Native AMM
lifecycle: mainnet
coverage: stub
summary: Alandale is a ve(3,3) DEX on Robinhood Chain. Traders swap through classic AMM pools or Algebra concentrated-liquidity pools. Liquidity providers earn LUTE emissions. Holders lock LUTE into veLUTE and vote each epoch on which pools receive those emissions. Official docs and the app say trading fees and bribes from a pool go to the lockers who voted for it. The app footer states it reads on-chain data from Robinhood, chain 4663.
tldr: Alandale is a ve(3,3) DEX on Robinhood Chain. Traders swap through classic AMM pools or Algebra concentrated-liquidity pools.
tldr_source: derived
why_people_care:
  - "Thesis: a Robinhood-only ve(3,3) venue: lock LUTE for veLUTE, vote weekly emissions, and collect that pool's fees. [claim S1 S3]"
  - "Traction (Sep 9, 2026): Llama Alandale V3 Robinhood TVL $870,422.52 and 24h DEX volume $8,857,627; V2 TVL $52,617.77 on the same chain. [claim S7 S8 S9]"
  - "Catalyst: Official X and the airdrop app say 1,300,000 LUTE is set aside for RVH holders and stakers. [claim S16 S26]"
risks:
  - Several documented ve(3,3) core addresses share 2430-byte bytecode; implementations were not read. [verified S5]
  - Llama audits field is 0; no audit report found on the site, docs, or GitHub this round. [claim S7 S12]
  - LUTE owner() is the Minter; AlgebraFactory owner is a small unread contract. [verified S5]
