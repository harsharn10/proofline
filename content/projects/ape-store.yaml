summary: Ape Store is a token launchpad on Robinhood Chain. A creator deploys from ape.store without seeding liquidity. Gitbook describes a bonding curve that lists on Uniswap near a 69k market cap; the official handle posted that the Robinhood path has no bonding curve and tokens go live on Uniswap. The live V30 router is 0x6e4910ea…87C1. The handle is @apedotstore.
