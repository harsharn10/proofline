summary: GIGA DEX is a native AMM on Robinhood Chain. Classic pools are a Uniswap v2 fork. Concentrated pools are a PancakeSwap v3 / Uniswap v3 fork. Liquidity incentives rebalance hourly toward gauged pools by rolling revenue; veGIGA is a six-month lock. The token is GIGA (1B minted at genesis). The handle is @giga_dex; the site is gigadex.fi.
