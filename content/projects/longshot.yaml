        - S3
  risk:
    - text: The workbook notes the name sits next to long.xyz (LONG) and Longbow (BOW); the products differ and are separate rows here.
      class: claim
      sources:
        - S4
    - text: "Receipts: every URL above was opened on 2026-09-03 and its excerpt copied from the page or API. [verified R-1 R-4 R-12] - Numbers: market cap, 24h volume and holders are the 4663 pair or token slice, not an all-chains total. [verified R-5 R-12] - Adversarial: the strongest contrary reading is that Longshot is LONG (app.long.xyz) or longshot.finance on Solana; the official domain, handle, CA and factory addresses argue against both."
      class: inference
      sources:
        - S6
        - S7
        - S9
    - text: LaunchFactoryV4 bytecode is unverified; owner is one EOA. [verified R-7 R-8] - Official 4663 pool liquidity is $4,446, below a $25k pool bar. [verified R-12] - Perp liquidation can zero that isolated margin while the token keeps trading. [claim R-1] - No named audit report was located. [claim R-1] - github.com/LongshotRH/Longshot returned 404.
      class: claim
      sources:
        - S20
