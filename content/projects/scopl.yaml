findings:
  positive:
    - text: The official account posted on 2026-08-29 that every order is a concentrated-liquidity position whose fills pay real swap fees split between user and protocol, with no emissions; a competition cited about $500k volume, 1,000+ fills and 37 traders.
      class: claim
      sources:
        - S4
    - text: A SpyWolf audit dated 30 Aug, as read by Proofline, names nine V2 contracts on chain 4663 with no major or critical findings and a revenue split of 30% referral, 50% buyback, 20% operations.
      class: claim
      sources:
        - S5
  risk:
    - text: Several accounts posted a 'holder portal' link at a third-party domain (cryptolot.lol) alongside the token address on 2026-08-30; the domain is not the project's and the project has not linked it.
      class: claim
      sources:
        - S6
        - S4
    - text: An Ethereum address (0x07f5b682…) circulated as SCOPL's contract is not a contract on chain 4663 per Proofline's check.
      class: claim
      sources:
        - S6
    - text: The token address above was flagged as suspect in one desk round (round 10) and the flag withdrawn in later rounds (12 and 16, on the account bio and a SpyWolf audit); not reproduced on Blockscout in this review.
      class: claim
      sources:
        - S6
        - S4
        - S5
    - text: 'Receipts: every URL above was opened on 2026-09-02 and its excerpt copied from the page or API JSON. [verified R-1 R-2 R-4 R-6 R-18 R-19] - Numbers: holders are the Blockscout token field; volume, market cap and TVL are the DexScreener SCOPL/ETH v4 pair slice, not all-pairs and not the pool-explorer chain total. [claim R-6 R-18 R-33] - Adversarial: the strongest contrary reading is that SCOPL is only a Pons-launched memecoin with a marketing site, or that V2 is still undeployed because X says "almost here". The verified PonsV2LauncherToken, the guide/API manager addresses with thousands of transactions, and the Uniswap v4 SCOPL/ETH pool argue against both. A weaker contrary reading is that the extra manager clones are the live product; the public API and guide name 0xf4badBc5… and 0xcdD1E3BC… only.'
      class: inference
      sources:
        - S8
        - S10
        - S14
        - S15
        - S16
        - S24
    - text: Live owner() of the managers, distributor and buyback vault was not reproduced; constructor ownership is one EOA with no timelock in the source read. [inference R-32 R-34] - Official X still describes V2 as almost here while the named V2 managers already execute on 4663. [disputed R-20 R-30] - ScoplOrderPolicy is verified on chain and named in the audit but omitted from the eight-contract guide. [verified R-2 R-17] - At least three additional ScoplLimitOrderManager and four additional ScoplV4LimitOrderManager contracts exist on 4663 beside the API addresses. [claim R-9] - Third-party posts pointed at crypto.cryptolot.lol with the official token address; that host is not scopl.live. [claim R-26] - Address 0x07f5B682… is not a contract on 4663. [verified R-28] - No official source repository was located.
      class: unknown
  missing:
    - text: Mainnet status rests on the project's own posts; not independently verified
    - text: Token address from the bio not reproduced on Blockscout
    - text: Nine V2 contract addresses not published
    - text: Buyback vault and fee router control
    - text: "Whether V2 is live: the audit text and the official account disagree"
    - text: "What address does owner() return today on the live V3/V4 managers, distributor and buyback vault — still EOA 0x7F4a8ff9… or a Safe? Next: eth_call owner() and pendingOwner() on each guide contract once RPC or a working explorer proxy is available"
    - text: "Is ScoplOrderPolicy 0xfA7a06b1… in the live order path, and why does the eight-contract guide omit it? Next: read verified manager constructor immutables for an orderPolicy address"
    - text: "Which of the extra ScoplLimitOrderManager / ScoplV4LimitOrderManager clones still hold position NFTs? Next: compare nextOrderId and NFT approvals on the extra clones"
    - text: "Is there a public source repository whose commit matches the verified bytecode? Next: ask the project in public for the repo URL and record the answer as a claim"
    - text: "Does DefiLlama have a Robinhood Chain slice for SCOPL under another slug? Next: search Llama chain=Robinhood for SCOPL / scopl.live"
  unresolved:
    - text: The audit text describes the protocol as already live while the official account still described V2 as around the corner; no deployed addresses for the nine V2 contracts were published.
    - text: activity.status remains unresolved (CON-1).
