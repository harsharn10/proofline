summary: "SCOPL is a non-custodial Uniswap V3/V4 one-tick limit-order layer: a user sets a target price, the order is minted as a concentrated-liquidity position NFT that stays in that wallet, and fills pay pool fees. The app at scopl.live/trade places those orders on Robinhood Chain. $SCOPL is a Pons V2-launched token; @scopl_live runs the site."
