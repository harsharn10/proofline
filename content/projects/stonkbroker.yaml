    - text: "What does owner() return on the NFT collection, Anvil vault, ActivationManager, loan vault and locker contracts, and is there a timelock? Next: eth_call owner() / pendingOwner() on 0x539c…, 0xE302…, 0xacD5…, 0xa7b9… and the V3/V4 lockers"
