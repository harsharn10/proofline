risks:
  - The ERC-20 is ownerless after deploy; the NFT collection and Anvil stack were created by one EOA and the collection bytecode includes Ownable. [claim S11]
  - Docs say activation weight resets on transfer, so a bought broker does not keep the prior holder's Clock In election. [claim S11]
  - STORMM remains a September 2026 module with no address in the live table. [claim S11]
