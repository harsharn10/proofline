    - text: "Is there an official Telegram, and what is the Discord invite named in the NYC dinner post? Next: record URLs if a later official post publishes them"
    - text: "Why does docs footer GitHub Clutch-L4bs/stonkbrokers 404 while stonkbroker-erc20 is public? Next: treat protocol source as unpublished until the org repo opens"
