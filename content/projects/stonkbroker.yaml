findings:
  positive:
    - text: The workbook records 4,444 ERC-6551 broker NFTs minted on 2026-07-17, each owning a token-bound wallet pre-seeded with Stock Tokens, with activation paid in $STONKBROKER (half burned).
      class: claim
      sources:
        - S5
    - text: DefiLlama listed StonkBrokers with about $25.6M parent TVL, $33,776 24h fees and $18,835 24h revenue on 2026-08-31 per Proofline's chain map.
      class: claim
      sources:
        - S4
    - text: The official account posted on 2026-08-29 a spec for STORMM, a Uniswap v4 hook overlay where LP positions also serve as options inventory, and announced a Leverage Machine of NFT-minted options (no liquidations) for September 2026.
      class: claim
      sources:
        - S6
  risk:
    - text: The workbook states at least four other contracts share the StonkBroker name; only the token address above is treated as the project's.
      class: claim
      sources:
        - S5
    - text: The workbook notes activation resets on transfer, so a bought NFT does not carry the prior holder's reward weight.
      class: claim
      sources:
        - S5
    - text: "Receipts: official cash and io terminals, docs, token whitepaper, X profile and named status URLs, Unchained, GitHub ERC-20 README, DexScreener token API, GeckoTerminal pool search, DefiLlama protocol/fees/dexs URLs, and Blockscout address/tx/source APIs were opened on 2026-09-03; excerpts are copied from those responses. [verified R-1 R-2 R-3 R-4 R-8 R-12 R-13 R-14 R-18] - Numbers: holders 33012 is the Blockscout token field; 24h volume 3357621.82 USD and liquidity 3581052.52 USD are the DexScreener Uniswap v4 STONKBROKER/ETH pair slice, not all-pairs; Gecko reserve_in_usd 5890033.38 is the same pool under a different field; Llama TVL 1016688.16 is the Robinhood Chain locker WETH slice, not staking 23.5M and not pair liquidity. [claim R-5 R-12 R-13 R-14] - Adversarial: the strongest contrary reading is that StonkBrokers is the chain's launchpad (DefiLlama category Launchpad; Smart Launch and Stonk Launcher are live) or that it is Stonks.fun / @realstonkbroker. Official copy names an ERC-6551 collection and Anvil NFTFi first; $STONKBROKER was created by an EOA CollectionToken constructor, not a launcher factory; @realstonkbroker bios itself as Fan Account; Stonks.fun is a different handle and ticker."
      class: inference
      sources:
        - S11
        - S12
        - S16
        - S35
    - text: NFT collection and Anvil stack were deployed from one EOA with an Ownable path on the collection; live owner() is unread. [inference R-8 R-9] - Token-bound Stock Token balances and who can executeCall were not sampled. [unknown] - Activation weight clears on transfer per docs, so secondary NFT buyers start at base until they pay again. [claim R-2] - STORMM / Leverage Machine is still a September 2026 module with no live address in the contract table. [claim R-2 R-19] - DexScreener liquidity.usd 3.58M and GeckoTerminal reserve_in_usd 5.89M describe the same pool. [disputed R-12 R-13] - HasLock ERC-20 PDFs are project-hosted and named to Admir Zlatic (0xSimpleFarmer); DefiLlama lists no audit links. [claim R-3 R-14] - Operator legal name is not a single string (SB (BVI) Ltd vs Clutch Labs, LLC). [disputed R-2 R-24] - @realstonkbroker repeats the CA as a Fan Account; the official handle on the site is @ClutchMarkets.
      class: claim
      sources:
        - S11
        - S35
