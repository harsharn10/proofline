findings:
  positive:
    - text: The workbook records 4,444 ERC-6551 broker NFTs minted on 2026-07-17, each owning a token-bound wallet pre-seeded with Stock Tokens, with activation paid in $STONKBROKER (half burned).
      class: claim
      sources:
        - S5
    - text: DefiLlama listed StonkBrokers with about $25.6M parent TVL, $33,776 24h fees and $18,835 24h revenue on 2026-08-31 per the desk map.
      class: claim
      sources:
        - S4
    - text: The official account posted on 2026-08-29 a spec for STORMM, a Uniswap v4 hook overlay where LP positions also serve as options inventory, and announced a Leverage Machine of NFT-minted options (no liquidations) for September 2026.
      class: claim
      sources:
        - S6
  risk:
    - text: The workbook states at least four other contracts share the StonkBroker name; only the token address above is treated as the project's.
      class: claim
      sources:
        - S5
    - text: The workbook notes activation resets on transfer, so a bought NFT does not carry the prior holder's reward weight.
      class: claim
      sources:
        - S5
  missing:
    - text: Collection, registry and Anvil addresses not located; the token address comes from the workbook and is not reproduced
    - text: Who can move assets out of a token-bound account
    - text: Activation and reward-weight mechanics unverified
    - text: STORMM and the Leverage Machine are announced for September 2026 — no deployment evidence reviewed
    - text: DefiLlama parent versus launchpad TVL split unexplained
    - text: The TVL harvested here ($25,599,049) is DefiLlama's parent-level figure for StonkBrokers; the research intake notes the StonkBrokers launchpad page shows about $1.05M — a child/parent split this harvest did not reconcile.
  unresolved:
    - text: DefiLlama shows about $25.6M parent TVL against $1.05M on its launchpad page — a parent/child split the desk could not explain.
