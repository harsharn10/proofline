    kind: docs
    accessed_at: 2026-09-03T04:20:00Z
    claim: How it works
    excerpt: "title How it works — circus. Classic Curve: 1B fixed supply, 800M sold on the curve, zero reserved for the team. Graduation at ~$6k becomes a Uniswap v4 pool, LP locked forever. Later table: Graduates to Uniswap v4 at ~4.2 ETH raised. Creator 80% of the 1% curve trade fee, then 60% of graduated pool fees. Fair Open lane powered by Doppler: born in a locked Uniswap v4 pool, no bonding phase. Until graduation the token is non-transferable outside the curve."
