  - id: S2
    url: https://www.letscashfun.com/docs
    publisher: letscashfun.com
    kind: docs
    accessed_at: 2026-09-03T02:44:00Z
    claim: Documentation & Developer Guide
    excerpt: "The launcher. One transaction deploys the token, creates and seeds the Uniswap v4 pool, locks the liquidity, and runs your first buy. Upgradeable behind a proxy so new launch modes can ship. hook: The fee engine, riding inside every swap via Uniswap v4 hooks. It also rejects every attempt to remove pool liquidity."
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S3
    url: https://www.letscashfun.com/about
    publisher: letscashfun.com
    kind: official-site
    accessed_at: 2026-09-03T02:44:00Z
    claim: How letscashfun.com works
    excerpt: "letscashfun is a memecoin launchpad on Robinhood Chain with one loop at its core: tokens launch, trading pays a tax the creator set, in ETH, never in memecoins. Creators keep everything above the platform's 0.3%, which buys CASHCAT on-chain, burns it, and pays to keep the place running. no bonding curve. no migration."
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
