    accessed_at: 2026-09-03T00:30:00Z
    claim: What is up.
    excerpt: up. is a ve(3,3) decentralized exchange on Robinhood Chain. Fees from staked liquidity go to the people who lock UP, emissions go to the people who stake liquidity, and the lockers vote on how those emissions are split. v2 pools spread liquidity across the whole price curve; v3 pools concentrate liquidity into price ranges.
