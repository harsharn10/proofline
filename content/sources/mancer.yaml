    excerpt: Mancer is the dex aggregator and order layer of Robinhood Chain. Your money stays in your own wallet until the moment it trades. Every minimum you sign is enforced on-chain. Limit orders are signed messages. OCO filling either side voids the other in the Orders contract. Discord https://discord.gg/mancer.
