    publisher: "@notawebsite_rh"
    kind: social
    accessed_at: 2026-09-03T02:12:00Z
    claim: Slots as smart wallets; NVDA bounty
    excerpt: "NEW: We just made your $WEBSITE slots a LOT smarter! Every slot on notawebsite now has a smart wallet attached to it. You can back any slot with a stock token. We've already seeded one slot with $50 worth of NVDA - but you have to hold 100k $WEBSITE to claim it. Every slot on $WEBSITE is already an NFT. EIP-6551 allows any NFT to become a token bound account."
