    publisher: "@notawebsite_rh"
    kind: social
    accessed_at: 2026-09-03T02:10:00Z
    claim: PageMarkets escrow design thread
    excerpt: "Dev update: Yesterday, we spent a lot of time wrangling with one of the toughest contract design challenges on PageMarkets - escrow. We started off by adding a separate treasury for every site. Next, we added a 6-hourly crawl that looks for our code snippet on every site added to the platform. Any site that doesn't show the snippet is marked as dark. Funds go to an escrow contract. This has a 28-day timer."
    hash: null
