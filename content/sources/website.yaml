    excerpt: The page is carved into 165 individually owned slots. Prices start at a floor of 0.001 ETH. Anyone can take an owned slot by paying 1.4× its current price. The previous owner is credited 1.15×. TinawSlots v2 0xa112f87dd43D4265Bdd3918A4bb593C7F83ED50a. TinawSlots v1 0x28Ddf599f8c16ee36a77D7b420973F7201a8BF3c frozen. Owner / treasury / creator 0x15e1D12Fc8A7bF97eaaB211d6353F585C53905c6. Robinhood Chain mainnet chain id 4663.
