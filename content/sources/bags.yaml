    accessed_at: 2026-09-03T04:15:00Z
    claim: Robinhood Chain Overview
    excerpt: Bags is deployed on Robinhood Chain as public permissionless contracts. Chain ID 4663. BagsFactory 0xe8Cc4431adF8b5A847C113EF0c6af9043219Cb37. BagsLens 0xC82Db941dAf90B754aecb5F7D14c683dc608d595. BagsV4Hook 0x2380aBf72C17aABAb76480244759AC7E2932EEcC. BagsVault 0x4861446aa7fFd9e67a83cBbAcb1A4B70540B83Aa. Bonding curve then Uniswap v4 with locked LP. Flat 2% fee, 1% creator / 1% protocol. creationFee default 0.02 ETH. Deploy block 7887312. Factory and vault are UUPS proxies.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
