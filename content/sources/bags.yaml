    excerpt: BagsFactory proxy 0xe8Cc4431…Cb37. BagsBondingCurveBeacon 0x8DCEcaf516C828A493C2C449c1E25F92cF80207E. BagsFeeShareBeacon 0xdFf07d39C5332C602e06FA64f0A97C92fd8537e0. ABIs at github.com/bagsfm/bags-idl robinhood-abi-v2. create / createAndBuy. allTokensLength. Owner-only setCreationFee / setGraduationThreshold / setPartnerFeeBps / setHook / setTokenImpl. Vault withdraw. Beacon upgradeTo retargets all curves or fee-shares. BagsV4Hook CREATE2 singleton not upgradeable.
