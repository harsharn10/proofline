    kind: official-site
    accessed_at: 2026-09-03T00:30:00Z
    claim: Vimen site
    excerpt: Vimen turns baskets of real tokenized stocks into single tokens you can hold, send, or take apart. MAG7, AI6 and HOOD6 baskets are live on Robinhood Chain. Follow @vimenprotocol. Mint fee 0.30%, hard-capped at 0.50% in code. Redeem is free, forever. Deposit cap at launch $100K.
    hash: null
