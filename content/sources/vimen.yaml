    researcher: grok-heavy
    available: true
  - id: S10
    url: https://docs.vimen.org/docs
    publisher: Vimen
    kind: docs
    accessed_at: 2026-09-03T00:30:00Z
    claim: What is Vimen?
    excerpt: Permissionless, fully-backed index baskets on Robinhood Chain — frozen or run by an agent. Chain id 4663. A basket token is an ERC-20 fully backed by fixed raw quantities of its constituent tokens, held by its own immutable contract. Mint deposits the constituents in-kind; redeem burns the basket token and returns the constituents in-kind.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
