    excerpt: "Safehood: Token Launchpad for Robinhood Chain. Launches tokens directly into Uniswap V3. No bonding curve. Live deployment chain id 4663: Launchpad 0xe893ca05D3F1235de22630504DcEa9e029294900, TokenFactory 0x5Cf777e19a6CD4B10c3Aa317a2B8E8bCC5F46364, FeeDistributor 0x8E0b175a36ee0854Cc2dC7AeC4B3f90857A059ca, Treasury 0xD401Ed3C128eaE756323e7EAE27B40407c7d499B. Web app: https://safehood.fun. Disclosure: liquidity is protocol-managed, not locked or burned. This codebase has not been audited."
