    url: https://wirebot.trade/
    publisher: Wire
    kind: official-site
    accessed_at: 2026-09-02T23:30:00Z
    claim: wirebot.trade home
    excerpt: "WIRE — The command layer for finance. Spot, perps and prediction markets on Robinhood Chain from X, Telegram or the web. WIRE is a non-custodial trading bot that lives on X. Mention @wirebotRH in plain language and it executes real on-chain trades. A 1% protocol fee (0.9% if referred) on every trade, send and drop flows into the treasury; a recurring job buys $WIRE and sends the tokens to a dead address. Counters: 893 trades, $137K volume, 148 launches, 2.5M WIRE burned."
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
