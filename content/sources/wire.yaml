    kind: docs
    accessed_at: 2026-09-02T23:32:00Z
    claim: WIRE documentation
    excerpt: "WIRE turns X into a trading terminal. Mention @wirebotRH in plain language and it executes real on-chain transactions on Robinhood Chain from a wallet that only you control. A 1% protocol fee on trading actions (0.9% if referred) funds a continuous $WIRE buyback-and-burn. Launch a token from a tweet; the pairing asset must be one pons has approved. Index baskets minted/redeemed via the Vimen protocol. Perps: order form and commands unlock at launch; FAQ says coming soon."
