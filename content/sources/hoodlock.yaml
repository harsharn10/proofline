    claim: Contract reference
    excerpt: Locker 0xd0f7d8c6e9f6d80c297bebe4f7fd1b9c8125c32f Holds ERC-20 tokens until a date. Burner 0x6bf43ca706faa8ea46803299c191484e82280652. Vesting 0x910e19bcC4bce46999994Ed7297E0Fc4431ec72E. lock/withdraw/extend/transferLockOwnership. Across all three contracts the admin can change only the fee, the fee collector and the admin key. The locker has no hard cap on the fee.
