    claim: v2 docs
    excerpt: pons v2 is a launch protocol. A creator deploys a token, the public buys it from a bonding curve, and once the curve is bought out the launch graduates into a Uniswap v4 pool whose liquidity is locked permanently. A launch can be paired against any token pons has approved. No audit has closed. Treat v2 as unaudited until the reports are published here. Public launches are closed, so only whitelisted addresses can create a token for now.
