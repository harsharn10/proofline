    claim: How lunch works, in detail
    excerpt: "lunch is a fair-launch coin platform on Robinhood Chain. Anyone can mint a coin in one transaction — no presale, no team allocation. Entire supply is a single full-range Uniswap V3 position at launch, LP locked from block one. No launch fee — you only pay gas. Launchers: V3 ETH 0xf5Ac…EFd6; V4 ETH 0xC783…B988; Stock/USDG V3 0x568E…1103; Stock/USDG V4 0x6Fda…Bb8c. Pair against ETH, USDG, or every Robinhood stock."
