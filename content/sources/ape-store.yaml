  - id: S3
    url: https://ape-store.gitbook.io/ape.store-docs/welcome-to-the-ape-store-documentation.md
    publisher: Ape Store
    kind: docs
    accessed_at: 2026-09-03T05:06:00Z
    claim: Welcome to the Ape Store documentation
    excerpt: Ape.store is a launchpad that allows its users to create tokens in seconds, without any required knowledge and without needing to provide liquidity. The created token (free of charge except for gas fees) becomes instantly tradable on the platform.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S4
    url: https://ape-store.gitbook.io/ape.store-docs/how-it-works.md
    publisher: Ape Store
    kind: docs
    accessed_at: 2026-09-03T05:06:00Z
    claim: How it works?
    excerpt: Tokens are created with virtual liquidity (bonding curve), and it is the investors who contribute to the liquidity pool (LP) through their buys and sells. Initial Market Cap generally 2800-3200. When a market cap of approximately 69000 is reached the token is automatically listed on Uniswap with a liquidity of 24000 (12K in ETH + 12K in tokens). The LP is burned and the Smart Contract is renounced in the same transaction. Listing example is basescan.org.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S5
    url: https://ape-store.gitbook.io/ape.store-docs/service-fees.md
    publisher: Ape Store
    kind: docs
    accessed_at: 2026-09-03T05:06:00Z
    claim: Service fees
    excerpt: "Token Creation: No fees (excluding gas fees). Trading on Ape.Store: 1% fee on buys/sells. Listing on Uniswap: 400 USD in ETH (rebalanced into the bonding curve). Ape.Store does not take any tokens from the projects created at any point, neither during creation nor during listing."
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
