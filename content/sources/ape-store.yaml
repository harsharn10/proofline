  - id: S7
    url: https://ape-store.gitbook.io/ape.store-docs/how-to-create-a-token.md
    publisher: Ape Store
    kind: docs
    accessed_at: 2026-09-03T05:06:00Z
    claim: How to create a token?
    excerpt: Connect your wallet to Ape.Store and ensure you have your ETH on the BASE blockchain. Click Token Deployer, complete the information, Deploy, optionally buy, confirm. Support https://t.me/ApeStoreSupport. Does not take any tokens from the projects created.
