    claim: Welcome to SwapHood
    excerpt: SwapHood is a liquidity protocol implemented in a system of non-upgradeable smart contracts on the RobinHood blockchain. Anyone can become a liquidity provider (LP) for a pool by depositing an equivalent value of each underlying token in return for pool tokens. In practice, SwapHood applies a 0.30% fee to trades, which is added to reserves.
