    publisher: SwapHood
    kind: docs
    accessed_at: 2026-09-03T02:42:00Z
    claim: Tokenomics
    excerpt: "Max Supply: 5,000,000. Daily Emissions: 2,500. Liquidity was bootstrapped via the SwapHood Farms, with emissions highly concentrated (75%) to the HOOD/ETH pair. While HOOD provides incentives to Liquidity Providers on the Farms, it will also receive 50% of the protocol revenue (retroactively Generated Trading Fees): Initially via token buybacks."
    hash: null
