    researcher: grok-heavy
    available: true
  - id: S14
    url: https://swaphood-finance.gitbook.io/swaphood-finance-docs/yields/revenue-sharing
    publisher: SwapHood
    kind: docs
    accessed_at: 2026-09-03T02:42:00Z
    claim: Revenue Sharing
    excerpt: "95% to $h33 (xHOOD stakers) - Protocol fees flow to active participants. This flows in the following way: HOOD is bought back, then this HOOD is used to increase h33 backing. SwapHood implements an exit rebase where exit penalties (50% tax) are streamed to h33 holders. xHOOD solves the need for token lock-ups; $h33 (Liquid staked xHOOD) solves the need for liquid wrappers."
    hash: null
