  - id: S13
    url: https://swaphood-finance.gitbook.io/swaphood-finance-docs/yields/farms
    publisher: SwapHood
    kind: docs
    accessed_at: 2026-09-03T02:42:00Z
    claim: Farms
    excerpt: "After users create a liquidity pool, on either V2 or Concentrated Liquidity, the pair can be deposited to earn $HOOD. V2: HOOD/ETH 75% of emissions 3,750 HOOD per day; VIRTUALS/ETH 2.5% 125 HOOD per day. V3: ETH/USDG 20% 1000 HOOD per day; CASHCAT/ETH 2.5% 125 HOOD per day."
    hash: null
