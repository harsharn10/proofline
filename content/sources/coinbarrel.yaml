  - id: S2
    url: https://docs.coinbarrel.com/start-here/what-is-coinbarrel.md
    publisher: Coinbarrel
    kind: docs
    accessed_at: 2026-09-03T03:20:00Z
    claim: What is Coinbarrel?
    excerpt: Coinbarrel launches tokens directly into live markets on the network selected in the site header. A launch has no bonding curve, migration threshold, or graduation transaction. Hook V5 is publicly live for all Robinhood creators. Every new launch uses a Hook V5 pool on Uniswap V4 with permanent liquidity custody.
