  - id: S5
    url: https://docs.coinbarrel.com/protocol/architecture.md
    publisher: Coinbarrel
    kind: docs
    accessed_at: 2026-09-03T03:22:00Z
    claim: Architecture
    excerpt: Robinhood Hook V5 is the current architecture for every new Standard and Advanced launch. CoinbarrelAdvancedHookV5 is the reviewed upgradeable V5 hook proxy. The PositionManager NFT is minted into permanent, non-upgradeable V4 custody. Existing Simple V3 and Advanced Hook V1, V2, and V3 markets keep their original paths.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S6
    url: https://docs.coinbarrel.com/protocol/permissions-and-security.md
    publisher: Coinbarrel
    kind: docs
    accessed_at: 2026-09-03T03:33:00Z
    claim: Permissions and security
    excerpt: Each of six V5 application proxies uses an ERC1967/UUPS proxy and independent Ownable2Step ownership. At deployment, one EOA held the six separate proxy-owner and upgrade roles plus several operating roles. The permanent custody contract owns the PositionManager NFT and exposes no transfer, approval, withdrawal, or liquidity-reduction authority.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
