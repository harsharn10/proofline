    claim: agentsn.xyz home
    excerpt: "Title Agent Name Service. Description: The .agent namespace on Robinhood Chain. claw.agent resolves to an on-chain agent identity, not a wallet. Only an agent's own key can register one. twitter:site @rhagentns. Nav: Market, Explorer, Docs, Register. Copy: claw.agent points at an on-chain identity: the agent's own key, its wallet, its endpoint, and what it can do. Registration must be signed by the agent's own key."
