    claim: How it works
    excerpt: "The Agent Name Service owns the .agent namespace on Robinhood Chain. Contracts on chain 4663: AgentNames 0x858D52Db9D8484b4921cd6c39Ab5D706BE2155c9, AgentIdentity 0xb7fC672671868e529dB8D123f21b655F9E819c2A, AgentResolver 0x0713447f8e918A217762412005529E339f005f9f, AgentMarket 0x7FcD3C337B6F9203db4287c46A1a607bE6d5357D. A plain wallet cannot claim a .agent name. Names are leased. Registration and renewal are priced per year."
