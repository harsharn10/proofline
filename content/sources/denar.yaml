    excerpt: title Denar — the money market for tokenized stocks. Lend USDG for yield, or borrow against your stock tokens without selling them. Isolated markets, priced by Chainlink, on Robinhood Chain. Open markets 7 / 7 Plus one ERC-4626 vault. href https://x.com/DenarMarkets. Footer token href https://robinhoodchain.blockscout.com/token/0x3786728a2c49C4617Bf4FE5BD82b90B6B0dF5508. Isolated Morpho Blue markets · Chainlink price feeds · liquidations route through Rialto.
