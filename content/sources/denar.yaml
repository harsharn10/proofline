  - id: S8
    url: https://docs.denar.markets/how-denar-works.md
    publisher: Denar
    kind: docs
    accessed_at: 2026-09-03T00:30:00Z
    claim: What is Denar / How Denar works
    excerpt: "The foundation is Morpho Blue: a minimal, immutable lending engine. Each Denar market is a sealed five-part tuple — collateral asset, loan asset, oracle, interest model, and liquidation threshold — fixed forever at creation. The Denar USDG Vault (dnUSDG) does it for them: one ERC-4626 deposit, allocated across the stock markets according to a supply queue and per-market caps. Raising a cap goes through a 1-day timelock."
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
