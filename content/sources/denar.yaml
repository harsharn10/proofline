    publisher: Denar
    kind: docs
    accessed_at: 2026-09-03T00:30:00Z
    claim: Governance & admin powers
    excerpt: "Admin roles are currently held by the deploying address — a single key, publicly identifiable on the Contracts page. The hardening path, in order: a dedicated operational key for the liquidation bot, then a multisig for the owner and curator roles, then a separate guardian. The Frontier vault launched without a delay on cap increases. A formal bug-bounty program is planned alongside the external audit."
