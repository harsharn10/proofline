  - id: S28
    url: https://docs.sighthood.com/concepts/claiming
    publisher: Sight
    kind: docs
    accessed_at: 2026-09-03T02:57:00Z
    claim: Claiming & 14-day window
    excerpt: You must successfully claim within fourteen (14) days of the round’s on-chain resolution time (resolvedAt). After that, remaining ETH in the round may be sent to the protocol fee recipient via sweepUnclaimed(). This matches the deployed PredictionRound rules and the in-app Terms of Service.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S29
    url: https://docs.sighthood.com/faq
    publisher: Sight
    kind: docs
    accessed_at: 2026-09-03T02:56:00Z
    claim: FAQ - Sight Docs
    excerpt: Sight is invite-gated. Ask an existing user for a single-use code. Which chain do I use? Robinhood Chain. Bets, claims, and the navbar balance use native ETH there. How is UP / DOWN decided? From Uniswap Token/WETH price movement between the round’s open and close snapshots. What is the fee? 2% on decisive winning pots by default.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S30
    url: https://docs.sighthood.com/risks
    publisher: Sight
    kind: docs
    accessed_at: 2026-09-03T02:56:00Z
    claim: Risks - Sight Docs
    excerpt: Rounds run in deployed contracts. Resolution depends on Uniswap pool data (spot and/or TWAP depending on version). Thin liquidity, manipulation, or unusual pool configuration can produce results that differ from a CEX chart. Missing a claim because the UI was down does not extend the 14-day window. Sight never holds your private keys.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
