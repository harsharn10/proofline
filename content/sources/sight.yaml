  - id: S5
    url: https://docs.sighthood.com/
    publisher: Sight
    kind: docs
    accessed_at: 2026-09-03T02:56:00Z
    claim: Introduction - Sight Docs
    excerpt: Sight is a social app for short-term memecoin UP/DOWN prediction markets on Robinhood Chain. Sight lets you predict whether a memecoin will go up or down over a short round (usually about 15 minutes) and settle in ETH on Robinhood Chain. Markets resolve from on-chain Uniswap price data. You sign bets and claims with your own wallet (via Privy). Sight does not custody your keys.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S6
    url: https://docs.sighthood.com/concepts/rounds
    publisher: Sight
    kind: docs
    accessed_at: 2026-09-03T02:57:00Z
    claim: How rounds work
    excerpt: A market is a memecoin listed in Sight. A round is one on-chain UP/DOWN contest for that market, typically about 15 minutes. Sight compares Uniswap Token/WETH price at the start of the round (price to beat) with the price at the end. Exact tick/price logic lives in the PredictionRound / UniswapPrice contracts. Parimutuel pots. After a decisive outcome, winners split the pot pro-rata by stake, after the protocol fee.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S7
    url: https://docs.sighthood.com/concepts/fees
    publisher: Sight
    kind: docs
    accessed_at: 2026-09-03T02:57:00Z
    claim: Fees & refunds
    excerpt: On a decisive outcome, a protocol fee is taken from the pot before winners are paid. Typical default Fee 2% (protocolFeeBps). Paid to Configured protocol fee recipient. Refund mode when open and close prices are a tie or there are no bets on the winning side. Bet limits often 0.001 ETH min and 1 ETH max.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
