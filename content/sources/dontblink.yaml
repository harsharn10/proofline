    kind: docs
    accessed_at: 2026-09-03T02:09:00Z
    claim: What’s new · dontblink
    excerpt: "Follow @dontblink_cto for the short version. v2.18 Sep 2, 2026 Latest: Price your token in any of 194 Robinhood stocks. Stock-priced launches went from three hand-picked tickers to the full universe: 194 Robinhood stock tokens. Stock-priced launch is now the first mode. v2 live: All four launch modes wired up through the v2 Portal: Classic, Pump Curve, Fair Drop and Celebrity Vault."
