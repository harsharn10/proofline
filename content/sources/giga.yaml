  - id: S5
    url: https://docs.gigadex.fi/security/overview
    publisher: GIGA DEX
    kind: docs
    accessed_at: 2026-09-03T05:40:00Z
    claim: Security overview
    excerpt: "Classic pools are a fork of Uniswap v2. Concentrated liquidity pools are built on PancakeSwap v3, a fork of Uniswap v3. Phase 1 contracts are immutable. Phase 2: GIGA Genesis (31 August 2026). The new code introduced at GIGA Genesis is undergoing a full independent security audit. The report will be published here when it is complete."
