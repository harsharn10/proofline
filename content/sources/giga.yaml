    url: https://docs.gigadex.fi/security/governance
    publisher: GIGA DEX
    kind: docs
    accessed_at: 2026-09-03T05:40:00Z
    claim: Governance and access control
    excerpt: Classic and concentrated-liquidity pools that hold user liquidity are not upgradeable. Custom protocol contracts (controller, fee center, emission center, vault) coordinate the incentive system and are controlled by the GIGA team. Every deployed contract is verified on the Robinhood Chain explorer.
