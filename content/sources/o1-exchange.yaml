    claim: Launchpad introduction
    excerpt: o1 Launchpad turns a token concept into a live onchain market. Creators configure the token, choose an available paired asset for the selected chain, and launch with permanently locked Uniswap v4 liquidity. Base currently supports ETH, USDC, eight registered Coinbase crypto majors, and four registered Base Stock Tokens through one launch factory. Robinhood supports ETH, USDG, and 194 registered Robinhood Stock Tokens through one launch factory.
