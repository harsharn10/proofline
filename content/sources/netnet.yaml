  - id: S10
    url: https://docs.netnet.capital/mechanism
    publisher: NetNet Capital Management
    kind: docs
    accessed_at: 2026-09-03T02:50:00Z
    claim: The Fund (Mechanism)
    excerpt: NET is a reserve-backed token mirroring the OlympusDAO v1 architecture — Token, rebasing staked token, Treasury, BondDepository, Distributor — plus TaxCollector, GenesisBond, InverseBond, PremiumSeller, and pTEAM. Epoch is 8 hours. There are no owner functions anywhere on the emissions path. Every NET is at all times backed by at least 1 USDG of risk-free value. Bond floor is NAV. Buyback Program standing bid at NAV − 1.5%.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
  - id: S11
    url: https://docs.netnet.capital/treasury
    publisher: NetNet Capital Management
    kind: docs
    accessed_at: 2026-09-03T02:50:00Z
    claim: Treasury & NAV
    excerpt: The reserve asset is USDG, and only USDG. At most 70% of treasury USDG may be deployed to Morpho. RFV = liquidUSDG + morphoPositionUSDG × (1 − 2%) + rfvOfPOL. NAV = RFV / totalSupply. Tokenized equities (NVDA, SPCX, AAPL; residual GOOGL, MSFT, COIN) are held in the NetNet RWA Sleeve — outside RFV and backing, never counted toward NAV. No code path moves reserves into the Sleeve.
    hash: null
    archive_url: null
    researcher: grok-heavy
    available: true
