    claim: Docs — LaunchHood
    excerpt: "LaunchHood is a memecoin launchpad on Robinhood Chain. Uniswap (V3 pools), pool fee 1%, starting market cap ≈ 1.35 ETH, creation fee none. 50/50 creator/protocol. Graduation threshold 4 ETH of net buys; what changes on-chain nothing. Factory 0x62B33A039D289CBDa50EbeB72Fe4261449E61Bcf. Liquidity locker 0x99B79154Ff4Fc0e313549B809254B02722631ee0. Token impl 0x5FDf73abC7A232d91b03638c2f9a52c16aB0E3bE. FAQ: locker has no withdrawal function — principal can never be pulled."
