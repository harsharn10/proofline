    url: https://docs.doppler.lol/explainer.md
    publisher: Doppler
    kind: docs
    accessed_at: 2026-09-03T04:48:00Z
    claim: Explainer
    excerpt: Doppler is an onchain protocol for launching tokens through various price discovery auctions. Airlock provides a unified interface. Static, multicurve, and dynamic auctions. Doppler Hooks at initialization, each swap, or graduation. Protocol fee 5% of trading fees on EVM. Contracts github.com/whetstoneresearch/doppler.
