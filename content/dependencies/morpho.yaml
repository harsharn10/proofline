id: morpho
name: Morpho Blue on Robinhood Chain
kind: lending
summary: Day-one lending primitive and the chain's largest TVL line; Robinhood Earn's USDG lending runs on it, and native overlays (Longbow, Vynex) open isolated markets on top. Cited, never profiled.
controls:
  - power: Market creation
    holder: Permissionless (any address) per Morpho Blue's design
    note: Isolated markets are immutable once created; the risk sits in the oracle and LLTV the creator picks
    class: unknown
    sources: []
  - power: Curator vault allocation
    holder: Vault curators (Steakhouse for the Earn path)
    note: A curated vault decides which markets receive deposits
    class: unknown
    sources: []
  - power: Protocol fee switch
    holder: Morpho governance
    note: The desk map records $0 protocol revenue on the chain slice
    class: unknown
    sources: []
failure_modes:
  - text: A Stock Token oracle or wrapper failure in one isolated market leaves bad debt in that market only.
    class: claim
    sources:
      - S1
  - text: Curator misallocation exposes Earn depositors to a market they did not choose.
    class: unknown
    sources: []
