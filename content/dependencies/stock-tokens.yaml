# Deployments generated by scripts/apply-harvest.mjs from research/inbox/grok-2026-08-30/drafts/stock-tokens-deployments.yaml
# (sheet 01 of the Grok workbook + the Chain File app's addresses). Four tickers carry two addresses because the two
# artifacts disagree; both are recorded, neither is canonical (owner decision 2026-08-30). Hand-edit controls/failure_modes/sources above.
id: stock-tokens
name: Robinhood Stock Tokens
kind: issuer-asset
summary: Robinhood-issued tokenized stocks and ETFs on Robinhood Chain (NVDA, AAPL, SPY, SPCX, GME, …), issued by Robinhood Assets (Jersey) Limited as tokenized debt securities. They appear as pair legs, vault assets, collateral and basket constituents in native plays; they are never a standalone profile (PRD §2.2).
controls:
  - power: Mint / burn
    holder: Issuer (Robinhood Assets (Jersey) Limited) via KYB authorized participants
    note: The Chain File dossier describes mint and burn sitting with KYB authorized participants; everyone else trades the float. Not reproduced against the contracts.
    class: claim
    sources:
      - S2
  - power: Registry of official addresses
    holder: Issuer
    note: docs.robinhood.com/chain/contracts is described by both intakes as generated from the on-chain asset registry and able to add tickers without notice. A token with the same ticker at any other address is not a Robinhood Stock Token.
    class: claim
    sources:
      - S1
      - S2
      - S3
  - power: Corporate actions (splits, dividends)
    holder: Issuer
    note: An on-chain multiplier (ERC-8056 per the dossier) adjusts for splits and reinvested dividends; Chainlink feeds are multiplier-aware.
    class: claim
    sources:
      - S2
  - power: Freeze / transfer restriction
    holder: Issuer
    note: Check for allowlist, pause or blacklist functions; the workbook notes the geo-fence sits at the distribution layer while the ERC-20 transfers freely once issued.
    class: unknown
    sources: []
  - power: Redemption
    holder: Issuer
    note: Off-chain redemption path and eligibility; not available to US persons per both intakes
    class: unknown
    sources: []
failure_modes:
  - text: Issuer freeze or blacklist strands tokens held inside a vault, basket or pool.
    class: unknown
    sources: []
  - text: Off-hours pricing and oracle behaviour when the underlying market is closed (Arrow, for one, limits equity collateral to US cash hours).
    class: unknown
    sources: []
  - text: Redemption suspension breaks in-kind basket exits.
    class: unknown
    sources: []
  - text: "Ticker collisions from permissionless deploys: the two intakes themselves give different addresses for NVDA, SPY, SPCX and GME, so any pair or reward route must be matched to the registry address, not the ticker."
    class: claim
    sources:
      - S1
      - S2
  - text: Private-company tokens (SPCX) have drawn public disavowals in the category per both intakes; legal treatment differs from listed-equity tokens.
    class: claim
    sources:
      - S1
      - S2
