id: uniswap
name: Uniswap on Robinhood Chain (v2 / v3 / v4, UniswapX)
kind: dex
summary: Day-one public DEX on Robinhood Chain and, per the desk's DefiLlama snapshot, about 80% of spot volume. Launchpads graduate into v3 or v4 pools; v4 hooks carry project-specific logic (Pons V2 fee hook, Hookr, Quotrons, STORMM, What The Hook, Fables).
