name: Pull chain facts

# Refreshes content/pulled/** from the chain, the explorer, DexScreener and DefiLlama.
#
# content/pulled/** is machine-owned (docs/research-system.md §2): scripts/pull.mjs is its only
# writer, the files are fully regenerated every run, and nobody hand-edits them. This workflow is
# consequently the one job in the repository allowed to push to main directly — everything else goes
# through a pull request. It earns that by writing nothing else: the data commit is scoped to
# content/pulled/**, and a failed `npm run validate` after the pull aborts before it, so a bad pull
# cannot land on main.
#
# Once daily at 09:17 UTC, away from the busy top of the hour.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated slugs (overrides cadence)"
        required: false
        type: string
      full:
        description: "Force explorer refresh even when signals are unchanged"
        required: false
        default: false
        type: boolean
      tier:
        description: "Limit the run to one tier"
        required: false
        default: all
        type: choice
        options: [all, hot, live, quiet, dormant]
      shard:
        description: "Read one half of the registry only (INDEX/TOTAL, e.g. 0/2)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

# A run takes tens of minutes and pushes to main. Two of them overlapping would race on the same
# files, and the loser's snapshot line would be lost rather than merged.
concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    name: Pull and commit
    runs-on: ubuntu-latest
    env:
      # Optional: without it the puller retains the public explorer fallback.
      BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
      # Stop starting new names at 30 minutes so there is time to validate, commit and push what was
      # already read. A run is latency-bound long before it is pace-bound, so it can reach the job
      # timeout with credits to spare — and a killed job loses every name it had finished.
      PULL_DEADLINE_MINUTES: "30"
    # One bot on main at a time: the compile workflow shares this group.
    #
    # Deliberately one job and not a two-shard matrix. `cancel-in-progress: false` protects the job
    # that is running, not the one that is queued behind it, so a compile run starting mid-pull would
    # cancel a pending second shard outright — half the registry silently skipping a cycle while the
    # workflow reports success, its queue entries never consumed and its spend never recorded. The
    # per-run credit cap is what bounds this job now, and `--shard` remains available by dispatch.
    concurrency:
      group: main-bots
      cancel-in-progress: false
    # Both weighted quota and elapsed time bound collection. Leave 15 minutes after the work
    # deadline for validation, budget persistence and push retries.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Pull chain facts
        env:
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_ONLY:-}" ]; then args+=(--only "$INPUT_ONLY"); fi
          if [ "${INPUT_FULL:-false}" = "true" ]; then args+=(--full); fi
          if [ -n "${INPUT_TIER:-}" ] && [ "$INPUT_TIER" != "all" ]; then args+=(--tier "$INPUT_TIER"); fi
          if [ -n "${INPUT_SHARD:-}" ]; then args+=(--shard "$INPUT_SHARD"); fi
          npm run pull -- ${args[@]+"${args[@]}"}

      # The gate. scripts/pull.mjs validates each document against schema/pulled.schema.json before
      # writing it, but this re-checks the whole corpus after the fact: a pulled file that breaks a
      # cross-file rule must fail the job rather than reach main.
      - name: Validate content (nothing is committed if this fails)
        run: npm run validate

      - name: Commit and push if the pulled facts changed
        run: |
          set -euo pipefail
          git add content/pulled ops/pull-budget.json ops/pull-queue.json
          if git diff --cached --quiet; then
            echo "no change in the pulled facts or the ops state — nothing to commit"
            exit 0
          fi
          git -c user.name="proofline-bot" -c user.email="bot@proofline.local" \
            commit -m "pull: chain facts $(date -u '+%Y-%m-%dT%H:%M:%SZ')" -m "Producer: pull-bot"
          # main moves while this job runs (merges, the compile bot): rebase onto it and retry.
          git config user.name "proofline-bot"
          git config user.email "bot@proofline.local"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && npm run validate && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "push failed after 3 attempts"; exit 1

      # The credits are spent whether or not the run succeeded. A job that trips the bot-wall gate,
      # or whose validation fails, still made every request it made — and if the day counter goes
      # home with the runner, the next job starts from the same stale number and the 60,000/day cap
      # stops existing: four crons of failing jobs would each be free to spend a full run cap.
      # So the counter is committed on its own, always, and the working tree's uncommitted data is
      # dropped rather than smuggled in behind a failed gate.
      - name: Record the credit budget even when the run failed
        if: always()
        run: |
          set -euo pipefail
          git add ops/pull-budget.json ops/pull-queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "budget already recorded — nothing to commit"
            exit 0
          fi
          git -c user.name="proofline-bot" -c user.email="bot@proofline.local" \
            commit -m "pull: credit budget $(date -u '+%Y-%m-%dT%H:%M:%SZ')" -m "Producer: pull-bot"
          git checkout -- . 2>/dev/null || true
          git clean -fd content/pulled 2>/dev/null || true
          git config user.name "proofline-bot"
          git config user.email "bot@proofline.local"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "budget push failed after 3 attempts"; exit 1

      - name: Retain daily selection and quota report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pull-${{ github.run_id }}
          path: |
            build/pull-plan.json
            build/pull-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Report incomplete collection
        if: always()
        run: |
          if [ -f build/pull-report.json ]; then
            jq '{status, selected, completed: (.completed | length), deferred: (.deferred_names | length), budget}' build/pull-report.json >> "$GITHUB_STEP_SUMMARY"
            if [ "$(jq -r .status build/pull-report.json)" != complete ]; then
              echo '::warning::Daily pull was degraded; inspect retained report before treating data as current.'
            fi
          else
            echo '::warning::Daily pull produced no completion report.'
          fi
