name: Validate

# Every PR, and every push to main: prove the content system and the site still build. Pushes to other
# branches are covered by their PR run — a `push: ["**"]` trigger ran everything twice per PR commit.
#
# The feed gate reads this workflow's conclusion before classifying and commenting on Grok PRs, so
# the only things allowed to fail the job are the real gates: root `npm test`, site typecheck, site
# build. Release blockers (corrections
# contact, verified deployments, approvals) run as a step with continue-on-error so they show up in
# the log without failing the check — a separate job with continue-on-error still reports a failed
# check run on the PR, which is what broke the old gate design.
on:
  pull_request:
  push:
    branches: [main]

# Only superseded PR runs are disposable. Never cancel a main verification run.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    name: Root + site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # Preserve only explicitly configured caches.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Root install
        run: npm ci

      - name: Root test (validate content/ + scoring fixtures + rule tests)
        run: npm test

      - name: Background workflow safety contracts
        run: node --test scripts/test-workflow-efficiency.mjs

      - name: Release blockers (informational — never fails this job)
        continue-on-error: true
        run: node scripts/validate.mjs --release

      - name: Site install
        working-directory: site
        run: npm ci

      - name: Site test (typecheck + Markdown security regression)
        working-directory: site
        run: npm test

      - name: Render node-server build
        working-directory: site
        run: npm run build:render

      - name: Render node-server smoke test
        working-directory: site
        run: npm run smoke:render

      - name: Cloudflare Workers build
        working-directory: site
        run: npm run build:cloudflare

      - name: Cloudflare Workers package check
        run: npm run cloudflare:dry

      - name: Cloudflare Workers smoke test
        working-directory: site
        run: npm run cloudflare:smoke
