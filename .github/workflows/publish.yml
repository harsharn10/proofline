name: Publish

# Pushes retain the approval-only publication path. Successful chain pulls run signal alerts; the
# schedules run the daily brief and Sunday wrap. Every path shares one serialized state file.
on:
  push:
    branches: [main]
    # A docs/frontend-only merge cannot add an approval or change a publication's evidence.
    # Keep policy, scoring dependencies and all canonical content in scope; scheduled/manual
    # recovery remains available independently of these push filters.
    paths:
      - 'content/**'
      - 'ops/telegram-review.json'
      - 'scripts/telegram-digest.mjs'
      - 'scripts/publish-preflight.mjs'
      - 'scripts/score.mjs'
      - 'scripts/lib/**'
      - 'schema/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish.yml'
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * 0"
  workflow_run:
    workflows: ["Pull chain facts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Telegram mode to run
        required: true
        default: publications
        type: choice
        options:
          - publications
          - alerts
          - brief
          - weekly

permissions:
  contents: write

# Approval commits can arrive seconds apart. Serialize deliveries and always check out the latest
# main so a queued run sees any sent-state commit made by the run before it.
concurrency:
  group: proofline-channel-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `secrets` context is NOT available in step- or job-level `if:` — only in `env:` and step
    # inputs. Hoisting the three secrets to job-level env lets every step's `if:` read them back out
    # as `env.*`, which IS available in `if:`.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        with:
          node-version: 22

      - name: Select Telegram mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          case "$EVENT_NAME" in
            workflow_run) mode="alerts" ;;
            schedule)
              if [ "$EVENT_SCHEDULE" = "0 14 * * 0" ]; then mode="weekly"; else mode="brief"; fi
              ;;
            workflow_dispatch) mode="${DISPATCH_MODE:-publications}" ;;
            *) mode="publications" ;;
          esac
          echo "arg=--$mode" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Telegram mode: $mode"

      # Built-in Node modules only: a paused wire/no-candidate publication never needs npm or scoring.
      # This is a preparation gate, not an approval. The sender reads/checks the ledger again.
      - name: Check whether publication preparation is needed
        id: preflight
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          PUBLICATION_MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/publish-preflight.mjs

      - name: Install
        if: ${{ steps.preflight.outputs.run == 'true' }}
        run: npm ci

      - name: Derive scores
        if: ${{ steps.preflight.outputs.run == 'true' }}
        run: npm run score

      # Skipped (not failed) when the repo secrets aren't set, so forks and secret-less CI runs stay
      # green.
      - name: Telegram delivery
        id: digest
        if: ${{ steps.preflight.outputs.run == 'true' }}
        run: node scripts/telegram-digest.mjs "${{ steps.mode.outputs.arg }}"

      # Only runs when the digest step above actually ran (outcome == success — 'skipped' when the
      # secrets were absent short-circuits this too), and only commits if that run actually changed
      # the state file (a re-run with nothing new to send leaves it byte-identical).
      - name: Commit updated telegram state
        if: ${{ steps.digest.outcome == 'success' }}
        run: |
          git config user.name "proofline-bot"
          git config user.email "proofline-bot@users.noreply.github.com"
          if ! git diff --quiet -- ops/telegram-state.json; then
            git add ops/telegram-state.json
            git commit -m "chore: update telegram state [skip ci]"
            # A controller may have committed another decision while this message was sending.
            # Preserve that newer decision, then place sent-state on top of it.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep 20
            done
            echo "telegram state push failed after 3 attempts"; exit 1
          else
            echo "No telegram state changes to commit."
          fi
