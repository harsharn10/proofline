name: Deploy Icarus pulse

# ops/telegram-review.json is a path so that flipping the delivery switch in the repository
# redeploys the Worker with the new value — that flag is what turns pulse messages on and off.
on:
  push:
    branches: [main]
    paths:
      - "pulse/**"
      - "scripts/lib/signals.mjs"
      - "ops/telegram-review.json"
      - ".github/workflows/pulse-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icarus-pulse-deploy
  cancel-in-progress: false

jobs:
  # Always runs: the bundle is checked on every push whether or not the account can be deployed to.
  # It also decides whether the deploy job runs at all, because the `secrets` context is not
  # available to a job-level `if` — a job output is.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      credentials: ${{ steps.credentials.outputs.present }}
      telegram_enabled: ${{ steps.switch.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # Preserve only explicitly configured caches.

      - name: Install the repository Wrangler version
        run: npm ci --prefix site

      - name: Verify the Worker bundle
        run: site/node_modules/.bin/wrangler deploy --dry-run --config pulse/wrangler.jsonc

      - name: Read the delivery switch from ops/telegram-review.json
        id: switch
        run: |
          enabled=$(jq -r '(.channel_enabled == true and .wire_enabled == true)' ops/telegram-review.json)
          echo "Telegram delivery for the pulse Worker: $enabled (channel_enabled and wire_enabled in ops/telegram-review.json)"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Check for Cloudflare deploy credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "Skipping the deploy: missing repository secret(s):$missing."
            echo "Add them in Settings → Secrets and variables → Actions, or connect the Worker"
            echo "through Cloudflare Workers Builds with pulse/ as its root directory."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: verify
    if: needs.verify.outputs.credentials == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # Preserve only explicitly configured caches.

      - name: Install the repository Wrangler version
        run: npm ci --prefix site

      # --var overrides wrangler.jsonc's paused default with the value the repository voted for.
      - name: Deploy the pulse Worker
        env:
          TELEGRAM_ENABLED: ${{ needs.verify.outputs.telegram_enabled }}
        run: |
          case "$TELEGRAM_ENABLED" in
            true|false) ;;
            *) echo "unexpected delivery switch value: $TELEGRAM_ENABLED"; exit 1 ;;
          esac
          site/node_modules/.bin/wrangler deploy --config pulse/wrangler.jsonc \
            --var "TELEGRAM_ENABLED:$TELEGRAM_ENABLED"
