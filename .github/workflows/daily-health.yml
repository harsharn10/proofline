name: Daily pipeline health
on:
  schedule:
    - cron: "37 15 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect latest scheduled coordinator and per-lane receipts/reports
        run: node scripts/pipeline-health.mjs
      - name: Inspect served revision and measurement freshness independently
        if: always()
        run: node scripts/measurement-health.mjs
