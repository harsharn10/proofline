name: Daily pipeline health
on:
  schedule:
    - cron: "37 15 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false # Preserve only explicitly configured caches.
      - name: Inspect latest scheduled coordinator and per-lane receipts/reports
        run: node scripts/pipeline-health.mjs
      - name: Inspect served revision and measurement freshness independently
        if: always()
        run: node scripts/measurement-health.mjs
