name: Automerge feed PRs

# Grok Bot contract (docs/integrations/grok-bot.md): a PR from a grok/<date> branch whose changed
# files are entirely within the allowed intake/feed paths gets squash-merged, but only after this
# workflow itself watches the PR's checks to completion and confirms they passed — it does not rely
# on GitHub's native "auto-merge" feature or on branch protection being configured, so it works even
# on a repo where nobody has flipped "Allow auto-merge" on. (Branch protection with validate.yml's
# `test` job as a required check is still worth adding as a second line of defense, but this workflow
# doesn't need it to behave correctly.) Anything else gets a comment asking for human review and the
# job exits 0 without merging.
#
# No approval step: merging with GITHUB_TOKEN doesn't require one unless branch protection demands
# reviews, and an approval step here would just file a duplicate approval on every re-run.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: startsWith(github.head_ref, 'grok/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed paths are within the allowed set
        id: paths
        run: |
          git fetch origin "$BASE_REF" --depth=1
          CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          echo "Changed files in this PR:"
          echo "$CHANGED"
          BAD=$(echo "$CHANGED" | grep -vE '^(content/feed/|content/sources/|content/accounts\.yaml$|research/inbox/)' || true)
          if [ -n "$BAD" ]; then
            echo "Outside the allowed paths:"
            echo "$BAD"
            echo "out_of_scope=true" >> "$GITHUB_OUTPUT"
          else
            echo "out_of_scope=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment — needs human review
        if: steps.paths.outputs.out_of_scope == 'true'
        run: gh pr comment "$PR_NUMBER" --body "needs human review (touches scoring/risk/census)"

      # Blocks until every check on the PR resolves; exits non-zero the moment one fails (validate.yml
      # runs on this same pull_request event, so its check is normally already registered or about to
      # be by the time this polls). A non-zero exit here fails this job and the merge step never runs.
      - name: Wait for checks to pass
        if: steps.paths.outputs.out_of_scope == 'false'
        run: gh pr checks "$PR_NUMBER" --watch --fail-fast

      - name: Squash-merge
        if: steps.paths.outputs.out_of_scope == 'false'
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
