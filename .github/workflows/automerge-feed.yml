name: Feed PR gate

# Grok Bot contract (docs/integrations/grok-bot.md §9): after Validate succeeds on a grok/<date>
# branch, this workflow classifies the PR and comments. It never merges or dispatches publishing;
# a controller reviews the PR before anything lands on main.
#
# Trigger is `workflow_run` on Validate's completion, NOT `pull_request` (final review C1):
#   - this file is read from `main`, so a PR cannot alter the gate it is judged by;
#   - there is nothing to wait for — Validate has already concluded by the time this runs. (The old
#     `gh pr checks --watch` design waited on its own in-progress check run and on the informational
#     release-blockers job, which fails by design before launch.)
#
# The file list comes from the pulls API, which reports renames and deletions explicitly — `git diff
# --name-only` collapses a rename to its destination (final review C2). Every file must be `added` or
# `modified`, carry no `previous_filename`, and sit under the allowlist; a modified source ledger must
# be additions-only. `content/accounts.yaml` is deliberately NOT on the allowlist: tier and note
# changes need extra eyes. Anything off the allowlist gets exactly one "needs human review" comment;
# allowlisted PRs get a "waiting for controller" comment. Permissions are comment-only so a merge
# command cannot be reintroduced accidentally.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  classify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'grok/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # No checkout: every step talks to the API with --repo. Nothing from the PR is executed here.
      - name: Find the open PR for the validated branch
        id: pr
        run: |
          PR_JSON="$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number,headRefOid --jq '.[0]')"
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "No open PR from $BRANCH into main — nothing to do."
            exit 0
          fi
          NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.number')"
          HEAD="$(printf '%s' "$PR_JSON" | jq -r '.headRefOid')"
          if [ "$HEAD" != "$HEAD_SHA" ]; then
            echo "PR #$NUMBER head is $HEAD but Validate passed on $HEAD_SHA — the newer push gets its own run."
            exit 0
          fi
          echo "PR #$NUMBER at $HEAD"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check the PR's file list against the allowlist
        if: steps.pr.outputs.number != ''
        id: paths
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          BAD=""
          # 1. Every file: status added|modified, no previous_filename, path under the allowlist.
          FILES="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv')"
          echo "Files in PR #$PR (status, path, previous path):"
          echo "$FILES"
          while IFS=$'\t' read -r STATUS FILENAME PREVIOUS; do
            [ -z "$FILENAME" ] && continue
            case "$STATUS" in
              added|modified) ;;
              *) BAD="$BAD $STATUS:$FILENAME"; continue ;;
            esac
            if [ -n "$PREVIOUS" ]; then BAD="$BAD renamed-from:$PREVIOUS"; continue; fi
            case "$FILENAME" in
              content/feed/*|content/sources/*|research/inbox/*) ;;
              *) BAD="$BAD outside-allowlist:$FILENAME" ;;
            esac
          done <<< "$FILES"
          # 2. A modified source ledger may only add lines: any removed line (other than a `---` header)
          #    in the API's patch, any deletion count, or a missing patch (diff too large) → human.
          SOURCES="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | select(.status == "modified" and (.filename | startswith("content/sources/"))) | [.filename, (.deletions | tostring), (.patch // "" | @base64)] | @tsv')"
          while IFS=$'\t' read -r FILENAME DELETIONS PATCH_B64; do
            [ -z "$FILENAME" ] && continue
            if [ -z "$PATCH_B64" ]; then BAD="$BAD no-patch:$FILENAME"; continue; fi
            if [ "$DELETIONS" != "0" ]; then BAD="$BAD deletions:$FILENAME"; continue; fi
            REMOVED="$(printf '%s' "$PATCH_B64" | base64 -d | grep -E '^-' | grep -vE '^---' || true)"
            if [ -n "$REMOVED" ]; then BAD="$BAD removed-lines:$FILENAME"; fi
          done <<< "$SOURCES"
          if [ -n "$BAD" ]; then
            echo "Needs extra-eyes review:$BAD"
            echo "allowlisted=false" >> "$GITHUB_OUTPUT"
            echo "reasons=$BAD" >> "$GITHUB_OUTPUT"
          else
            echo "Every file is an addition or in-place modification under the allowlist — still waits for a controller."
            echo "allowlisted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment — needs human review (once per PR)
        if: steps.pr.outputs.number != '' && steps.paths.outputs.allowlisted == 'false'
        env:
          PR: ${{ steps.pr.outputs.number }}
          REASONS: ${{ steps.paths.outputs.reasons }}
        run: |
          MARKER="automerge-feed: needs-human-review"
          EXISTING="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | contains(\"$MARKER\")) | .id")"
          if [ -n "$EXISTING" ]; then
            echo "Already commented (comment id(s): $EXISTING) — not repeating."
            exit 0
          fi
          BODY="needs controller review. This workflow never merges. Extra eyes are required because the PR renames, deletes or rewrites something, or touches a path outside content/feed/, content/sources/ (additions only) and research/inbox/.

          Reasons:$REASONS

          <!-- $MARKER -->"
          gh pr comment "$PR" --repo "$REPO" --body "$BODY"

      - name: Comment — Validate passed, waiting for controller
        if: steps.pr.outputs.number != '' && steps.paths.outputs.allowlisted == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          MARKER="automerge-feed: waiting-for-controller"
          EXISTING="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | contains(\"$MARKER\")) | .id")"
          if [ -n "$EXISTING" ]; then
            echo "Already commented (comment id(s): $EXISTING) — not repeating."
            exit 0
          fi
          BODY="Validate passed and the diff is inside the intake allowlist. The bot cannot merge it. A controller must review and merge the PR; channel delivery remains a separate approval in /review.

          <!-- $MARKER -->"
          gh pr comment "$PR" --repo "$REPO" --body "$BODY"
